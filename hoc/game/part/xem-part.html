<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xưởng lắp PART robot</title>
<style>:root{--ink:var(--g-vienDam);--paper:var(--g-kemV10);--wood:var(--g-goV13);--yellow:var(--g-vangV3)}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--g-camSangV5);color:var(--ink);font:16px system-ui,sans-serif}.wrap{max-width:880px;margin:auto;padding:22px}h1,h2{margin:.1em 0 .45em}.panel{background:var(--paper);border:3px solid var(--ink);box-shadow:0 5px 0 var(--wood);padding:15px;margin:16px 0}.work{display:block}.choice{margin:0 0 12px}.choice b{display:block;margin-bottom:5px}.buttons{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;font-weight:700;padding:6px 9px;border:2px solid var(--ink);background:var(--g-kemSangV4);cursor:pointer}button.on{background:var(--yellow);box-shadow:inset 0 -3px var(--g-goSangV5)}.preview{min-height:244px;width:100%;margin-top:16px;display:grid;place-items:center;overflow:hidden;background:var(--g-bangSangV5);background-image:linear-gradient(var(--g-xanhLaToiV8) 1px,transparent 1px),linear-gradient(90deg,var(--g-xanhLaToiV8) 1px,transparent 1px);background-size:16px 16px;border:3px solid var(--ink)}canvas{image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;height:auto}.error{min-height:25px;color:var(--g-doToiV7);font-weight:700}.functions{background:var(--g-lamToiV1);color:var(--g-trangV14);padding:10px;line-height:1.7;min-height:46px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:9px}.mini{padding:7px;background:var(--g-xanhLaV13);border:2px solid var(--ink);font-size:12px;font-weight:700;text-align:center;min-width:0}.mini canvas{display:block;margin:5px auto 0;width:96px;height:96px}.silhouettes{display:flex;gap:10px;flex-wrap:wrap}.sil{width:86px;padding:5px;text-align:center;border:1px solid var(--ink);background:var(--g-kemSangV4);font-size:11px;font-weight:700}.sil canvas{display:block;width:48px;height:48px;margin:3px auto}@media(max-width:480px){.wrap{padding:12px}.panel{padding:11px}.preview{min-height:210px}}</style>
<body><main class="wrap"><h1>Xưởng lắp PART robot</h1><p>Tay gắn bằng thanh ngang ở mũi xe; cảm biến nằm ở hai bên hông. Drone chỉ treo nam châm dưới bụng, gắn cảm biến màu ở khung và camera nhìn xuống ở mép trên khung.</p><section class="panel work"><div id="controls"></div><div class="preview" id="preview"></div><div class="error" id="error"></div><b>Hàm Python mở ra</b><div id="functions" class="functions"></div></section><section class="panel"><h2>So phong cách: thân + tay</h2><div id="grid" class="grid"></div></section><section class="panel"><h2>Bóng đen – so dáng từng PART</h2><div id="silhouettes" class="silhouettes"></div></section></main>
<script src="../bang-mau.js"></script><script src="part.js"></script><script src="part-hai-banh.js"></script><script src="part-xich.js"></script><script src="part-nhen.js"></script><script src="part-omni.js"></script><script src="part-drone.js"></script><script src="part-kep.js"></script><script src="part-tay-xoay.js"></script><script src="part-nam-cham.js"></script><script src="part-nem.js"></script><script src="part-hoi.js"></script><script src="part-son.js"></script><script src="part-khoang-cach.js"></script><script src="part-mau.js"></script><script src="part-cham.js"></script><script src="part-camera.js"></script><script src="part-camera-bay.js"></script><script src="part-hong-ngoai.js"></script>
<script>var BM = window.BangMau;(()=>{const $=s=>document.querySelector(s),S={than:'hai-banh',tay:'kep',hong:'khoang-cach',tren:'camera',bung:null,mat:false,scale:5,banh:false,tuThe:'tren',kep:'mo',xoay:'truoc',cam:false,bat:false,ngam:1,dangNem:false,dangBanTruoc:false,dangBanSau:false};function button(t,on,fn){let b=document.createElement('button');b.textContent=t;b.className=on?'on':'';b.onclick=fn;return b}function choices(title,key,list){let e=document.createElement('div');e.className='choice';e.innerHTML='<b>'+title+'</b>';let row=document.createElement('div');row.className='buttons';list.forEach(d=>row.append(button(d.ten,S[key]===d.ma,()=>{S[key]=d.ma;draw()})));e.append(row);return e}function camList(port){return[{ma:null,ten:'Không gắn'},...Part.ds('cam-bien').filter(d=>(Array.isArray(d.gan)?d.gan:[d.gan]).includes(port))]}function draw(){if(S.than==='drone'){S.tay='nam-cham';if(S.tren==='camera')S.tren=null}let c=$('#controls');c.replaceChildren();let tay=S.than==='drone'?[Part.lay('tay','nam-cham')]:Part.ds('tay');c.append(choices('THÂN','than',Part.ds('than')),choices(S.than==='drone'?'NAM CHÂM DƯỚI BỤNG':'TAY Ở PHÍA TRƯỚC','tay',tay),choices('CẢM BIẾN HAI BÊN HÔNG','hong',camList('hong')),choices('CAMERA TRÊN THÂN','tren',camList('tren')));if(S.than==='drone')c.append(choices('CAMERA NHÌN XUỐNG (CHỈ DRONE)','bung',camList('bung')));let flags=[['Bánh/cánh quạt quay','banh'],['Tay hạ thấp','tuThe'],['Kẹp đóng','kep'],['Kẹp có thùng','cam'],['Cảm biến bật','bat'],['Camera đang đọc (mắt sáng)','mat'],['Máy ném bật cần','dangNem'],['Súng hơi: nòng trước bắn','dangBanTruoc'],['Súng hơi: nòng sau bắn','dangBanSau']];let box=document.createElement('div');box.className='buttons';flags.forEach(([t,k])=>{let on=k==='tuThe'?S[k]==='duoi':k==='kep'?S[k]==='dong':S[k];box.append(button(t,on,()=>{S[k]=k==='tuThe'?(on?'tren':'duoi'):k==='kep'?(on?'mo':'dong'):!on;draw()}))});box.append(button('Khớp xoay: '+({trai:'trái',truoc:'trước',phai:'phải'})[S.xoay],S.xoay!=='truoc',()=>{S.xoay=({truoc:'trai',trai:'phai',phai:'truoc'})[S.xoay];draw()}));box.append(button('Tầm ném: '+S.ngam,S.ngam>1,()=>{S.ngam=S.ngam===3?1:S.ngam+1;draw()}));c.append(box);let cams=[['hong',S.hong],['tren',S.tren],['bung',S.than==='drone'?S.bung:null]].filter(x=>x[1]).map(x=>({o:x[0],ma:x[1]})),config={than:S.than,tay:S.tay,camBien:cams};try{let cv=Part.ghep(config,{than:{banh:{trai:S.banh,phai:S.banh},quat:S.banh},tay:{tuThe:S.tuThe,kep:S.kep,xoay:S.xoay,cam:S.cam,vat:S.cam?'go':null,bat:S.bat,ngam:S.ngam,dangNem:S.dangNem,dangBanTruoc:S.dangBanTruoc,dangBanSau:S.dangBanSau},camBien:{bat:S.bat,mat:S.mat}});cv.style.width=cv.style.height=(40*S.scale)+'px';$('#preview').replaceChildren(cv);$('#error').textContent='';$('#functions').innerHTML=Part.hamGoc(config).map(x=>'<code>'+x+'()</code>').join(' ')}catch(e){$('#preview').replaceChildren();$('#error').textContent=e.message;$('#functions').textContent='Chọn tổ hợp hợp lệ để xem hàm.'}}function grid(){let g=$('#grid');Part.ds('than').forEach(t=>{let tay=t.ma==='drone'?'nam-cham':'kep',cams=t.ma==='drone'?[{ma:'camera-bay',o:'bung'},{ma:'mau',o:'hong'}]:[{ma:'khoang-cach',o:'hong'}],e=document.createElement('div');e.className='mini';e.textContent=t.ten+' + '+Part.lay('tay',tay).ten;try{e.append(Part.ghep({than:t.ma,tay,camBien:cams},{camBien:{bat:true}}))}catch(err){e.append(err.message)}g.append(e)})}function silhouette(d){let p=Part._veMot(d,{}),cv=document.createElement('canvas'),g;cv.width=p.w;cv.height=p.h;g=cv.getContext('2d');for(let y=0;y<p.h;y++)for(let x=0;x<p.w;x++)if(p.get(x,y)){g.fillStyle=BM.robotDen;g.fillRect(x,y,1,1)}return cv}function silhouettes(){let e=$('#silhouettes');['than','tay','cam-bien'].forEach(loai=>Part.ds(loai).forEach(d=>{let x=document.createElement('div');x.className='sil';x.textContent=d.ma;x.append(silhouette(d));e.append(x)}))}draw();grid();silhouettes()})()</script></body></html>
