<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xưởng lắp PART robot</title>
<style>
  :root{--ink:#1b120a;--paper:#f7e5b9;--wood:#9a5b2a;--yellow:#ffcf30;--blue:#26324e;--cyan:#7ff0ff}*{box-sizing:border-box}body{margin:0;background:#d7b67b;color:var(--ink);font:16px system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}h1{margin:0 0 5px;font-size:clamp(25px,4vw,40px)}p{margin:0 0 20px}.panel{background:var(--paper);border:3px solid var(--ink);box-shadow:0 5px 0 #75411e;padding:16px;margin:16px 0}.work{display:grid;grid-template-columns:minmax(280px,1fr) minmax(260px,.9fr);gap:20px;align-items:start}.choice{margin:0 0 13px}.choice b{display:block;margin-bottom:6px}.buttons{display:flex;flex-wrap:wrap;gap:6px}button{font:inherit;font-weight:700;background:#fff3d3;border:2px solid var(--ink);padding:6px 9px;cursor:pointer}button:hover,button:focus{background:#ffe58a;outline:3px solid #44a9c5;outline-offset:2px}button.on{background:var(--yellow);box-shadow:inset 0 -3px #d99418}.preview{background:#466f53;border:3px solid var(--ink);min-height:280px;display:grid;place-items:center;background-image:linear-gradient(#608b65 1px,transparent 1px),linear-gradient(90deg,#608b65 1px,transparent 1px);background-size:16px 16px}.preview canvas,.mini canvas{image-rendering:pixelated;image-rendering:crisp-edges}.scale{display:flex;justify-content:center;gap:7px;margin:12px 0}.functions{background:#26324e;color:#e4fbff;padding:12px;min-height:48px;line-height:1.7}.functions code{margin-right:8px}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.checks label{display:flex;gap:7px;align-items:center;font-weight:650}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.mini{background:#dcebc9;border:2px solid var(--ink);padding:8px;text-align:center;font-size:12px;font-weight:700}.mini canvas{display:block;margin:4px auto 0;width:96px;height:96px}@media(max-width:700px){.work{grid-template-columns:1fr}.checks{grid-template-columns:1fr}}
</style><body><main class="wrap"><h1>Xưởng lắp PART robot</h1><p>Chọn linh kiện, bật trạng thái và quay robot. Mọi hình được vẽ pixel bằng code.</p>
<section class="panel work"><div id="controls"></div><div><div class="preview" id="preview"></div><div class="scale" id="scale"></div><b>Hàm Python mở ra</b><div class="functions" id="functions"></div></div></section>
<section class="panel"><h2>So phong cách: thân × tay</h2><p>Mỗi ô dùng cảm biến khoảng cách ở ổ trước.</p><div class="grid" id="grid"></div></section></main>
<script src="part.js"></script><script src="part-hai-banh.js"></script><script src="part-xich.js"></script><script src="part-nhen.js"></script><script src="part-omni.js"></script><script src="part-kep.js"></script><script src="part-day.js"></script><script src="part-nam-cham.js"></script><script src="part-khoang-cach.js"></script><script src="part-mau.js"></script><script src="part-cham.js"></script><script src="part-camera.js"></script>
<script>
(()=>{const $=s=>document.querySelector(s), state={than:'hai-banh',tay:'kep',truoc:'khoang-cach',duoi:'mau',tren:'camera',huong:0,scale:4,banh:false,tuThe:'tren',kep:'mo',cam:false,bat:false};const labels={than:'Thân',tay:'Tay'};
function button(text,on,act){let b=document.createElement('button');b.textContent=text;b.className=on?'on':'';b.onclick=act;return b}function choices(title,key,list){let e=document.createElement('div');e.className='choice';e.innerHTML='<b>'+title+'</b>';let row=document.createElement('div');row.className='buttons';list.forEach(d=>row.append(button(d.ten,state[key]===d.ma,()=>{state[key]=d.ma;draw()})));e.append(row);return e}function draw(){let c=$('#controls');c.innerHTML='';c.append(choices('THÂN','than',Part.ds('than')),choices('TAY','tay',Part.ds('tay')));c.append(choices('Cảm biến ổ trước','truoc',[{ma:null,ten:'Không gắn'},...Part.ds('cam-bien').filter(x=>x.gan==='truoc')]));c.append(choices('Cảm biến dưới gầm','duoi',[{ma:null,ten:'Không gắn'},...Part.ds('cam-bien').filter(x=>x.gan==='duoi')]));c.append(choices('Cảm biến trên thân','tren',[{ma:null,ten:'Không gắn'},...Part.ds('cam-bien').filter(x=>x.gan==='tren')]));let box=document.createElement('div');box.className='checks';[['Bánh đang quay','banh'],['Tay hạ thấp','tuThe'],['Kẹp đóng','kep'],['Đang cầm thùng','cam'],['Cảm biến bật','bat']].forEach(([t,k])=>{let l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.checked=k==='tuThe'?state[k]==='duoi':k==='kep'?state[k]==='dong':state[k];i.onchange=()=>{state[k]=k==='tuThe'?(i.checked?'duoi':'tren'):k==='kep'?(i.checked?'dong':'mo'):i.checked;draw()};l.append(i,t);box.append(l)});c.append(box);let cams=[['truoc',state.truoc],['duoi',state.duoi],['tren',state.tren]].filter(x=>x[1]).map(x=>({o:x[0],ma:x[1]}));let config={than:state.than,tay:state.tay,camBien:cams},cv=Part.ghep(config,{than:{banh:{trai:state.banh,phai:state.banh}},tay:{tuThe:state.tuThe,kep:state.kep,cam:state.cam,bat:state.bat},camBien:{bat:state.bat}},state.huong);cv.style.width=cv.style.height=(40*state.scale)+'px';$('#preview').replaceChildren(cv);$('#functions').innerHTML=Part.hamGoc(config).map(x=>'<code>'+x+'()</code>').join('');let sc=$('#scale');sc.innerHTML='';[2,4,8].forEach(n=>sc.append(button(n+'×',state.scale===n,()=>{state.scale=n;draw()})));sc.append(button('Quay ↻ '+['Lên','Phải','Xuống','Trái'][state.huong],false,()=>{state.huong=(state.huong+1)%4;draw()}));}function grid(){let g=$('#grid');Part.ds('than').forEach(t=>Part.ds('tay').forEach(a=>{let e=document.createElement('div');e.className='mini';e.textContent=t.ten+' + '+a.ten;let cv=Part.ghep({than:t.ma,tay:a.ma,camBien:[{ma:'khoang-cach',o:'truoc'}]},{camBien:{bat:true}});e.append(cv);g.append(e)}))}draw();grid()})();
(()=>{const section=document.createElement('section'),grid=document.createElement('div');section.className='panel';section.innerHTML='<h2>Xem nhanh: thân + kẹp + mắt khoảng cách + camera</h2><p>Cùng một cấu hình trên mọi thân để soi rõ khớp tay và các ổ không đè nhau.</p>';grid.className='grid';Part.ds('than').forEach(than=>{const item=document.createElement('div');item.className='mini';item.textContent=than.ten;const cv=Part.ghep({than:than.ma,tay:'kep',camBien:[{ma:'khoang-cach',o:'truoc'},{ma:'camera',o:'tren'}]},{camBien:{bat:true}});item.append(cv);grid.append(item)});section.append(grid);document.querySelector('main').append(section)})();
</script></body></html>
