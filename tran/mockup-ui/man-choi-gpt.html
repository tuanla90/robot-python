<html lang="vi">
<head>

<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#18251e;--deep:#124536;--deep2:#0d342a;--cream:#fff1bc;--wood:#a85e2a;--wood2:#6e351d;--line:#362719;--gold:#f8c84e;--blue:#61bce3;--green:#8fce61;--purple:#9a78dd;--red:#e95b51}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101311;color:var(--ink);font-family:"Pixelify Sans",monospace}body{display:grid;place-items:center;padding:20px;background-image:radial-gradient(#2d332d 1px,transparent 1px);background-size:6px 6px}.phones{display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap}.phone{width:360px;height:640px;overflow:hidden;position:relative;border:5px solid #100f0c;border-radius:24px;background:#c87937;box-shadow:0 14px 0 #050605,0 26px 32px #0009;isolation:isolate}.screen{height:100%;padding:9px 10px;background-color:#a95e2c;background-image:repeating-linear-gradient(4deg,transparent 0 12px,#71351855 13px 14px),repeating-linear-gradient(94deg,transparent 0 18px,#e7974b33 19px 20px)}.screen:before,.screen:after{content:"";position:absolute;z-index:-1}.screen:before{width:46px;height:78px;left:-20px;top:117px;transform:rotate(-9deg);background:#f4d563;border:2px solid #704d23;box-shadow:inset 0 0 0 3px #e7bd4f}.screen:after{right:-18px;bottom:60px;width:45px;height:72px;transform:rotate(12deg);background:#f2d35e;border:2px solid #704d23}.screw{position:absolute;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#dae0d5,#59625b 48%,#bfc6be);border:1px solid #29322e;box-shadow:0 1px #fff6}.screw:after{content:"";position:absolute;left:1px;right:1px;top:4px;border-top:1px solid #324039;transform:rotate(-35deg)}.s1{top:7px;left:7px}.s2{top:7px;right:7px}.s3{bottom:7px;left:7px}.s4{bottom:7px;right:7px}.topbar{height:38px;display:flex;align-items:center;gap:7px;padding:0 7px;background:#e9b950;border:2px solid #5f361e;border-radius:6px;box-shadow:inset 0 2px #ffe895,0 2px #592d17;color:#1e2c25;font-weight:700;font-size:18px;letter-spacing:.1px}.level{white-space:nowrap}.stars{margin-left:auto;display:flex;gap:2px}.sprite{image-rendering:pixelated;image-rendering:crisp-edges;display:block}.star{width:17px;height:17px}.menu{width:23px;height:21px;margin-left:5px;background:repeating-linear-gradient(#57351e 0 3px,transparent 3px 7px);border-radius:2px}.fieldrow{height:247px;margin-top:8px;display:flex;gap:8px}.field{width:245px;height:245px;padding:4px;border:3px solid #113e31;border-radius:9px;background-color:#1c7154;background-image:linear-gradient(90deg,#ffffff25 1px,transparent 1px),linear-gradient(#ffffff25 1px,transparent 1px),radial-gradient(#8bd67622 1px,transparent 1px);background-size:47px 47px,47px 47px,8px 8px;box-shadow:inset 0 0 0 2px #57a27b,0 3px #532b18}.grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);width:100%;height:100%;position:relative}.tile{position:relative;display:grid;place-items:center}.tile canvas{width:39px;height:39px}.robot{position:absolute;z-index:5;transition:transform .25s steps(4);pointer-events:none}.robot canvas{width:40px;height:40px}.robot.hit{animation:hit .35s steps(2) 2}@keyframes hit{50%{filter:sepia(1) saturate(7) hue-rotate(310deg);margin-left:3px}}.conveyor canvas{animation:belt .6s steps(2) infinite}@keyframes belt{50%{filter:brightness(1.17)}}.controls{flex:1;display:flex;flex-direction:column;gap:7px;align-items:stretch}.control{height:43px;border:2px solid #51311e;border-radius:6px;box-shadow:inset 0 2px #fff8,0 3px #512514;display:grid;place-items:center;cursor:pointer;transition:transform .08s}.control:active{transform:translateY(2px);box-shadow:inset 0 2px #0003}.control canvas{width:27px;height:27px}.run{background:#4cba6b}.step{background:#edb83c}.reset{background:#4193d3}.hint{background:#8266c7}.clock{margin-top:auto;text-align:center;color:#fff1bb;font:17px VT323,monospace;line-height:16px;text-shadow:1px 1px #0b2820}.lower{height:321px;margin-top:8px;display:grid;grid-template-columns:1.15fr .85fr;gap:7px}.panel{height:100%;border:2px solid #56301c;border-radius:8px;background:#0f4939;padding:6px;box-shadow:inset 0 0 0 2px #2d785c,0 3px #60321a;min-width:0}.paneltitle{height:23px;display:flex;align-items:center;color:#fff1bd;font:21px VT323,monospace;letter-spacing:.4px;white-space:nowrap}.erase{margin-left:auto;border:1px solid #9c482e;background:#c75640;color:#fff5d4;height:20px;min-width:24px;padding:0;font:20px VT323,monospace;cursor:pointer}.slots{display:flex;flex-direction:column;gap:3px}.slot{height:23px;display:flex;align-items:center;gap:3px;cursor:pointer}.num{display:grid;place-items:center;width:20px;height:23px;flex:0 0 20px;border:1px solid #80b588;background:#236550;color:#fff6ca;font:18px VT323,monospace}.code{height:23px;min-width:0;flex:1;display:flex;align-items:center;padding:0 7px;background:var(--cream);border:1px solid #b78b43;border-radius:3px;font:17px VT323,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 1px #fff}.slot.empty .code{background:#dce4cf66;border:1px dashed #99b09a}.slot.locked .code{justify-content:center;background:#999d9b;color:#3b4643}.lock{width:10px;height:8px;border:2px solid #3e4947;border-radius:1px;position:relative}.lock:before{content:"";position:absolute;width:6px;height:6px;border:2px solid #3e4947;border-bottom:0;left:0;bottom:5px;border-radius:5px 5px 0 0}.slot.selected .code{outline:2px solid #ffe466;outline-offset:1px;background:#fff8cf}.slot.running .code{background:#ffdf75;animation:pulse .5s steps(2) infinite}@keyframes pulse{50%{background:#fff6b8}}.slot.over .code{animation:over .25s steps(2) 4}@keyframes over{50%{background:#f15d54}}.library{display:flex;flex-direction:column;gap:5px}.groupLabel{font:16px VT323,monospace;color:#aadbb8;line-height:16px}.brick{height:29px;border:2px solid #24536a;border-radius:4px;position:relative;display:flex;align-items:center;justify-content:center;padding:0 3px;font:16px VT323,monospace;font-weight:bold;cursor:pointer;box-shadow:inset 0 2px #fff8,0 2px #142b25;white-space:nowrap;letter-spacing:-.3px}.brick:before,.brick:after{content:"";position:absolute;top:-5px;width:8px;height:4px;border:1px solid currentColor;border-bottom:0;border-radius:2px 2px 0 0;background:inherit}.brick:before{left:7px}.brick:after{right:7px}.root{background:var(--blue);color:#173b51}.wait{background:#f2c752;color:#6b4d18}.userfn{background:var(--green);color:#1d552d}.newfn{background:#b290e4;color:#3d2964;border-color:#5a4683;font-size:14px}.edit{margin-left:4px;border:0;background:#fff1b7;color:#234;border-radius:2px;font:15px VT323,monospace;cursor:pointer}.workOverlay{position:absolute;inset:0;z-index:15;transform:translateY(101%);transition:transform .28s steps(6);background:#a95e2c}.workOverlay.open{transform:translateY(0)}.worktop{height:38px;display:flex;align-items:center;gap:5px;padding:0 5px}.back{border:0;background:#e9b950;color:#25322b;border:2px solid #60351e;border-radius:5px;height:29px;font:18px "Pixelify Sans",monospace;cursor:pointer}.worktitle{margin-left:auto;margin-right:auto;color:#fff1bd;font:23px VT323,monospace;text-shadow:2px 2px #512b17}.testbox{height:210px;position:relative;border:2px solid #55301d;border-radius:8px;background:#0e4939;padding:7px;box-shadow:inset 0 0 0 2px #2b785d,0 3px #60321a}.functionSign{height:30px;display:flex;align-items:center;padding:0 9px;width:max-content;background:#f5c957;border:2px solid #754424;border-radius:4px;font:21px VT323,monospace;box-shadow:inset 0 1px #ffec98}.testline{display:flex;align-items:center;gap:8px;margin-top:8px}.testfield{width:139px;height:139px;padding:4px;border:3px solid #113e31;border-radius:7px;background-color:#1c7154;background-image:linear-gradient(90deg,#ffffff25 1px,transparent 1px),linear-gradient(#ffffff25 1px,transparent 1px);background-size:43px 43px;position:relative}.testgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);height:100%}.testgrid .tile canvas{width:34px;height:34px}.testgrid .robot canvas{width:39px;height:39px}.testActions{flex:1;display:flex;flex-direction:column;gap:9px}.try{height:45px;border:2px solid #51311e;background:#4cba6b;border-radius:6px;color:#fff7c6;box-shadow:inset 0 2px #fff7,0 3px #512514;font:20px VT323,monospace;cursor:pointer}.result{color:#fff1bd;font:18px VT323,monospace;line-height:18px}.worklower{height:373px;margin-top:8px;display:grid;grid-template-columns:1.15fr .85fr;gap:7px}.worklower .panel{height:100%}.worklower .slot{height:26px}.worklower .code,.worklower .num{height:26px}.worklower .library{gap:7px}.worklower .brick{height:34px;font-size:18px}
@media(max-width:760px){body{padding:12px}.phones{gap:18px}}@media(max-width:390px){body{place-items:start center;padding:0}.phone{border-radius:0;transform-origin:top center;transform:scale(calc(100vw / 360));margin-bottom:calc(-640px + 100vw * 640 / 360)}}
</style><style>.lower{height:311px}.testbox{height:202px}.worklower{height:364px}.pencil{position:absolute;z-index:-1;width:11px;height:82px;left:7px;top:174px;transform:rotate(23deg);background:repeating-linear-gradient(90deg,#eeb83e 0 5px,#d58e22 5px 7px);border:1px solid #66391c}.pencil:before{content:"";position:absolute;top:-11px;left:-1px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid #e9d1a0}.pencil:after{content:"";position:absolute;bottom:-5px;left:-1px;width:11px;height:5px;background:#e66c57}</style>
</head>
<body>
<main class="phones" aria-label="Hai trạng thái màn chơi Robot Python">
  <section class="phone" id="mainPhone" aria-label="Màn chơi chính"><div class="screen"><i class="pencil"></i>
    <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>
    <header class="topbar"><span class="level">2.4 · Rẽ phải</span><span class="stars" id="stars"></span><span class="menu" aria-label="Menu"></span></header>
    <div class="fieldrow"><div class="field"><div class="grid" id="mainGrid"></div></div><div class="controls">
      <button class="control run" id="runBtn" title="Chạy"><canvas data-icon="play"></canvas></button><button class="control step" id="stepBtn" title="Một nhịp"><canvas data-icon="step"></canvas></button><button class="control reset" id="resetBtn" title="Lại"><canvas data-icon="reset"></canvas></button><button class="control hint" title="Gợi ý"><canvas data-icon="bulb"></canvas></button><div class="clock">NHỊP <span id="beat">0</span></div>
    </div></div>
    <div class="lower"><section class="panel"><div class="paneltitle">CHƯƠNG TRÌNH 5/10 <button class="erase" id="eraseMain" title="Xóa dòng">⌫</button></div><div class="slots" id="mainSlots"></div></section>
    <section class="panel"><div class="paneltitle">KHỐI LỆNH</div><div class="library"><span class="groupLabel">Gốc</span><button class="brick root" data-main="left_move()">left_move</button><button class="brick root" data-main="right_move()">right_move</button><button class="brick wait" data-main="wait()">wait</button><span class="groupLabel">Hàm của em</span><button class="brick userfn" data-main="move()">move() <b class="edit">✎</b></button><button class="brick userfn" data-main="turn_right()">turn_right() <b class="edit">✎</b></button><button class="brick newfn">＋ Hàm mới</button></div></section></div>
  </div><section class="workOverlay" id="overlay" aria-label="Xưởng hàm mở trên màn chơi"></section></section>

  <section class="phone" aria-label="Màn Xưởng hàm"><div class="screen" id="sideWorkshop"></div></section>
</main>
<script>
(()=>{'use strict';
const C={n:10,main:['move()','move()','turn_right()','move()','move()',null,null,null,null,null],work:['left_move()','wait()',null,null,null,null,null,null,null,null]};
const funcs={move:['left_move()','right_move()','wait()'],turn_right:['left_move()','wait()']};
const mainState={x:1,y:4,dir:0,beat:0,queue:[],running:false,active:-1,hit:false};
const wall=[[3,1],[2,3]],belt={x:4,y:4,dir:3},goal={x:3,y:2};let mainSelect=0,workSelect=0,conveyorCount=0;
function px(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}
function spr(canvas,type,dir=0,on=false){if(!canvas)return;canvas.width=16;canvas.height=16;const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,16,16);const p=(x,y,w,h,k)=>px(c,x,y,w,h,k);if(type==='wall'){p(1,1,14,14,'#172128');p(2,2,12,12,'#59616a');for(let i=-10;i<16;i+=6){c.strokeStyle='#313942';c.lineWidth=2;c.beginPath();c.moveTo(i,15);c.lineTo(i+15,0);c.stroke()}p(2,2,12,1,'#9aa0a0');p(1,1,14,1,'#0b1316')}else if(type==='belt'){p(1,1,14,14,'#173c51');p(2,2,12,12,'#3180a5');p(2,2,12,1,'#70c5de');[[2,2],[12,2],[2,12],[12,12]].forEach(a=>{p(a[0],a[1],2,2,'#c2d9d5');p(a[0],a[1],1,1,'#4a5660')});p(6,4,4,6,'#d8ecde');p(5,8,6,2,'#d8ecde');p(7,10,2,2,'#d8ecde')}else if(type==='flag'){p(7,2,2,12,'#d8d8bf');p(5,13,6,2,'#263b33');p(9,3,6,4,'#d94a3e');p(9,3,1,5,'#fff0a5')}else if(type==='robot'){p(4,2,8,12,'#253032');p(2,5,3,7,on?'#f4e06d':'#172124');p(11,5,3,7,on?'#f4e06d':'#172124');p(5,3,6,10,'#bf771d');p(6,4,4,8,'#f7bb38');p(7,5,2,2,'#fff1aa');p(7,2,2,3,'#24444a');c.save();c.translate(8,8);c.rotate(dir*Math.PI/2);p(-1,-7,2,4,'#1d514d');c.restore()}else if(type==='star'){p(7,1,2,3,'#ffdf4c');p(4,4,8,4,'#ffdf4c');p(2,7,12,2,'#ffdf4c');p(5,9,6,4,'#ffdf4c');p(7,12,2,3,'#ffdf4c');if(!on){c.globalAlpha=.7;c.fillStyle='#704b2c';c.fillRect(4,4,8,5)}}else if(type==='play'){p(4,2,3,12,'#fff6c5');p(7,4,3,8,'#fff6c5');p(10,6,2,4,'#fff6c5')}else if(type==='step'){p(2,3,2,10,'#fff6c5');p(6,3,2,10,'#fff6c5');p(9,4,3,8,'#fff6c5');p(12,6,2,4,'#fff6c5')}else if(type==='reset'){c.strokeStyle='#fff6c5';c.lineWidth=3;c.beginPath();c.arc(8,8,5,0.3,5.6);c.stroke();p(2,2,5,3,'#fff6c5')}else if(type==='bulb'){p(6,3,4,7,'#fff6c5');p(5,5,6,3,'#fff6c5');p(6,11,4,2,'#fff6c5');p(3,1,1,3,'#fff6c5');p(12,1,1,3,'#fff6c5');p(1,7,3,1,'#fff6c5');p(12,7,3,1,'#fff6c5')}}
function initCanvases(root=document){root.querySelectorAll('canvas[data-icon]').forEach(x=>spr(x,x.dataset.icon));document.querySelectorAll('#stars').forEach(box=>{if(box.children.length)return;for(let i=0;i<3;i++){let q=document.createElement('canvas');q.className='sprite star';spr(q,'star',0,i<2);box.append(q)}})}
function grid(el,small=false){el.innerHTML='';let n=small?3:5;for(let y=0;y<n;y++)for(let x=0;x<n;x++){let t=document.createElement('div');t.className='tile';t.dataset.x=x;t.dataset.y=y;el.append(t);if(!small){let kind=wall.some(w=>w[0]===x&&w[1]===y)?'wall':(belt.x===x&&belt.y===y?'belt':(goal.x===x&&goal.y===y?'flag':''));if(kind){let k=document.createElement('canvas');k.className='sprite '+kind;spr(k,kind);t.append(k)}}}}
function putRobot(gridEl,state,small=false){gridEl.querySelectorAll('.robot').forEach(e=>e.remove());let cell=gridEl.querySelector(`[data-x="${state.x}"][data-y="${state.y}"]`);if(!cell)return;let r=document.createElement('div');r.className='robot';let can=document.createElement('canvas');can.className='sprite';spr(can,'robot',state.dir,state.wheel);r.append(can);cell.append(r);if(state.hit)r.classList.add('hit')}
function makeSlots(target,arr,chosen,work=false){target.innerHTML='';arr.forEach((v,i)=>{let row=document.createElement('div');row.className='slot '+(!v?'empty':'')+(i===chosen?' selected':'')+(i===9?' locked':'');row.dataset.i=i;row.innerHTML=`<span class="num">${i+1}</span><span class="code">${i===9&&!v?'<i class="lock"></i>':(v||'')}</span>`;row.onclick=()=>{if(work){workSelect=i;renderWork()}else{mainSelect=i;renderMain()}};target.append(row)})}
function renderMain(){makeSlots(document.getElementById('mainSlots'),C.main,mainSelect);grid(document.getElementById('mainGrid'));putRobot(document.getElementById('mainGrid'),mainState);document.getElementById('beat').textContent=mainState.beat;document.querySelectorAll('[data-main]').forEach(b=>b.classList.toggle('active',false));if(mainState.active>=0){let rows=document.querySelectorAll('#mainSlots .slot');rows[mainState.active]?.classList.add('running')}}
function workshopMarkup(id){return `<div class="screen"><i class="pencil"></i><i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i><div class="worktop"><button class="back" data-back>‹ Về sân</button><strong class="worktitle">XƯỞNG HÀM</strong></div><div class="testbox"><div class="functionSign">def turn_right():</div><div class="testline"><div class="testfield"><div class="testgrid" id="${id}TestGrid"></div></div><div class="testActions"><button class="try" data-try="${id}">▶ Thử hàm</button><div class="result" id="${id}Result">Sẵn sàng thử<br>quay sang phải.</div></div></div></div><div class="worklower"><section class="panel"><div class="paneltitle">THÂN HÀM 2/10 <button class="erase" data-erase="${id}">⌫</button></div><div class="slots" id="${id}Slots"></div></section><section class="panel"><div class="paneltitle">KHỐI LỆNH</div><div class="library"><span class="groupLabel">Gốc</span><button class="brick root" data-work="left_move()">left_move</button><button class="brick root" data-work="right_move()">right_move</button><button class="brick wait" data-work="wait()">wait</button><span class="groupLabel">Hàm của em</span><button class="brick userfn" data-work="move()">move()</button></div></section></div></div>`}
document.getElementById('overlay').innerHTML=workshopMarkup('over');document.getElementById('sideWorkshop').innerHTML=workshopMarkup('side');
function renderWork(){['over','side'].forEach(id=>{let root=document.getElementById(id==='over'?'overlay':'sideWorkshop');makeSlots(root.querySelector('#'+id+'Slots'),C.work,workSelect,true);grid(root.querySelector('#'+id+'TestGrid'),true);putRobot(root.querySelector('#'+id+'TestGrid'),{x:1,y:1,dir:0},true)})}
function insert(arr,at,val,slotRoot){if(at>=10||arr.every(Boolean)){slotRoot.querySelectorAll('.slot').forEach(x=>x.classList.add('over'));setTimeout(()=>slotRoot.querySelectorAll('.slot').forEach(x=>x.classList.remove('over')),600);return}arr[at]=val;return Math.min(9,at+1)}
function erase(arr,at){if(!arr[at])return;arr.splice(at,1);arr.push(null)}
document.addEventListener('click',e=>{let edit=e.target.closest('.edit');if(edit){document.getElementById('overlay').classList.add('open');return}let m=e.target.closest('[data-main]');if(m){let n=insert(C.main,mainSelect,m.dataset.main,document.getElementById('mainSlots'));if(n!==undefined)mainSelect=n;renderMain()}let w=e.target.closest('[data-work]');if(w){let n=insert(C.work,workSelect,w.dataset.work,document.getElementById('overSlots'));if(n!==undefined)workSelect=n;renderWork()}if(e.target.closest('#eraseMain')){erase(C.main,mainSelect);renderMain()}let er=e.target.closest('[data-erase]');if(er){erase(C.work,workSelect);renderWork()}if(e.target.closest('[data-back]'))document.getElementById('overlay').classList.remove('open');let t=e.target.closest('[data-try]');if(t)tryFunc(t.dataset.try)})
function reset(){mainState.x=1;mainState.y=4;mainState.dir=0;mainState.beat=0;mainState.queue=[];mainState.running=false;mainState.active=-1;mainState.hit=false;conveyorCount=0;renderMain()}
function flatten(){let q=[];C.main.forEach((c,row)=>{if(!c)return;let base=c.replace('()','');let acts=funcs[base]||[c];acts.forEach(a=>q.push({a,row,func:funcs[base]?base:''}))});return q}
function executeOne(){if(!mainState.queue.length)mainState.queue=flatten();if(!mainState.queue.length)return false;let pack=mainState.queue.shift();mainState.active=pack.row;mainState.beat++;let a=pack.a,old={x:mainState.x,y:mainState.y};mainState.wheel=a==='left_move()'?'L':a==='right_move()'?'R':'';if(a==='left_move()'&& !mainState._right){mainState._left=true}else if(a==='right_move()'&&!mainState._left){mainState._right=true}else if(a==='right_move()'&&mainState._left){mainState.y-=1;if(mainState.dir===1){mainState.x+=1;mainState.y+=1}else if(mainState.dir===2){mainState.y+=2}else if(mainState.dir===3){mainState.x-=1;mainState.y+=1}mainState._left=false;mainState._right=false}else if(a==='wait()'){if(mainState._left&&!mainState._right)mainState.dir=(mainState.dir+1)%4;if(mainState._right&&!mainState._left)mainState.dir=(mainState.dir+3)%4;mainState._left=false;mainState._right=false}
if(mainState.x<0||mainState.x>4||mainState.y<0||mainState.y>4||wall.some(w=>w[0]===mainState.x&&w[1]===mainState.y)){mainState.x=old.x;mainState.y=old.y;mainState.hit=true}else mainState.hit=false;
if(mainState.x===belt.x&&mainState.y===belt.y){conveyorCount++;if(conveyorCount===2){mainState.x--;conveyorCount=0}}else conveyorCount=0;if(mainState.x===goal.x&&mainState.y===goal.y){document.querySelectorAll('#stars canvas').forEach(x=>spr(x,'star',0,true));mainState.running=false;setTimeout(()=>alert('Hoàn thành! Robot đã chạm cờ.'),50)}renderMain();return mainState.queue.length>0}
let loop;document.getElementById('runBtn').onclick=()=>{if(mainState.running)return;mainState.queue=flatten();mainState.running=true;loop=setInterval(()=>{let more=executeOne();if(!more){clearInterval(loop);mainState.running=false;mainState.active=-1;renderMain()}},430)};document.getElementById('stepBtn').onclick=()=>{if(!mainState.running){if(!mainState.queue.length)mainState.queue=flatten();executeOne()}};document.getElementById('resetBtn').onclick=reset;
function tryFunc(id){let root=document.getElementById(id==='over'?'overlay':'sideWorkshop');let result=root.querySelector('#'+id+'Result');let hasLeft=C.work.includes('left_move()'),hasWait=C.work.includes('wait()');result.innerHTML='Đang thử…';setTimeout(()=>{result.innerHTML=hasLeft&&hasWait?'Robot quay sang phải ✓':'Cần left_move + wait';},500)}
initCanvases();renderMain();renderWork();
})();
</script></body></html>
