<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đội Robot · màn chơi (bàn xưởng)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b120a; --cream:#fff3d6;
  --px:"Pixelify Sans","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --mono:"VT323",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:#16110c; color:var(--cream); font-family:var(--px);
  background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);
  background-size:8px 8px;
  min-height:100vh; padding:44px 12px 28px; display:flex; flex-wrap:wrap; gap:44px; justify-content:center; align-items:flex-start;
  -webkit-user-select:none; user-select:none;
}
button{font:inherit;border:0;padding:0;margin:0;cursor:pointer;color:inherit;background:none}
.pxi{image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none}
.tex{image-rendering:pixelated;image-rendering:crisp-edges}

.unit{position:relative;flex:none}
.cap{position:absolute;left:0;right:0;top:-30px;text-align:center;font:600 14px var(--px);color:#b79b78}
.phone{padding:10px;background:#0b0805;position:relative;
  box-shadow:0 0 0 3px #3a2c1f,0 0 0 6px #0b0805,0 22px 40px 6px #000a}
.screen{
  width:360px;height:640px;position:relative;overflow:hidden;overflow:clip;
  background-color:#b87638; background-image:var(--wood); background-size:192px 120px;
  image-rendering:pixelated;
  padding:8px 10px 8px;
  clip-path:polygon(0 8px,2px 8px,2px 6px,4px 6px,4px 4px,6px 4px,6px 2px,8px 2px,8px 0,
    calc(100% - 8px) 0,calc(100% - 8px) 2px,calc(100% - 6px) 2px,calc(100% - 6px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 6px,calc(100% - 2px) 6px,calc(100% - 2px) 8px,100% 8px,
    100% calc(100% - 8px),calc(100% - 2px) calc(100% - 8px),calc(100% - 2px) calc(100% - 6px),calc(100% - 4px) calc(100% - 6px),calc(100% - 4px) calc(100% - 4px),calc(100% - 6px) calc(100% - 4px),calc(100% - 6px) calc(100% - 2px),calc(100% - 8px) calc(100% - 2px),calc(100% - 8px) 100%,
    8px 100%,8px calc(100% - 2px),6px calc(100% - 2px),6px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 6px),2px calc(100% - 6px),2px calc(100% - 8px),0 calc(100% - 8px));
  display:flex;flex-direction:column;
}
.screen>*{position:relative;z-index:2}
.screen>.deco,.ws-ov>.deco{overflow:hidden;overflow:clip;position:absolute;left:0;top:0;right:0;bottom:0;z-index:1;pointer-events:none}
.deco canvas{position:absolute}

/* ---------- gạch / nút nổi ---------- */
.bt{
  position:relative;color:var(--ink);background:var(--c,#fff);
  box-shadow:0 0 0 2px var(--ink),0 4px 0 2px var(--ink),inset 0 3px 0 var(--hi,#fff8),inset 0 -4px 0 var(--lo,#0004);
  transition:transform .05s;
}
.bt:active,.bt.pr{transform:translateY(3px);box-shadow:0 0 0 2px var(--ink),0 1px 0 2px var(--ink),inset 0 3px 0 var(--hi,#fff8),inset 0 -2px 0 var(--lo,#0004)}
.g-gr{--c:#4cc24f;--hi:#a6f2a0;--lo:#2a8a35}
.g-yl{--c:#ffc933;--hi:#fff09a;--lo:#cf8f10}
.g-bl{--c:#3b82e0;--hi:#9cc6ff;--lo:#1f56a8}
.g-pu{--c:#a070e6;--hi:#d9c4ff;--lo:#6a3fb4}
.g-rd{--c:#e8504a;--hi:#ffaaa2;--lo:#a52a2c}
.g-cy{--c:#38c6de;--hi:#9aeefa;--lo:#1b8aa4}
.g-or{--c:#e08a3a;--hi:#ffcf94;--lo:#9c5418}
.g-wd{--c:#c07a3a;--hi:#f0b878;--lo:#7c4a20}

/* ---------- thanh trên ---------- */
.top{flex:none;height:38px;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.plaque{flex:1;min-width:0;height:36px;position:relative;background:#ffd95a;display:flex;align-items:center;padding:0 12px 0 10px;gap:8px;white-space:nowrap;overflow:hidden;
  box-shadow:0 0 0 2px var(--ink),inset 0 3px 0 #fff2a6,inset 0 -3px 0 #e0a92a;color:var(--ink)}
.plaque::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;background:linear-gradient(135deg,transparent 50%,#b87918 50%,#b87918 100%)}
.plaque .n{font:400 28px/1 var(--mono);color:#7a3a0a}
.plaque .t{font:700 17px/1 var(--px)}
.plaque .d{width:5px;height:5px;background:#7a3a0a;flex:none}
.stars{flex:none;display:flex;gap:2px;height:36px;align-items:center;padding:0 4px;background:rgba(40,20,6,.45);box-shadow:inset 0 0 0 2px var(--ink)}
.menu{flex:none;width:38px;height:34px;display:flex;align-items:center;justify-content:center}
.back{flex:none;width:104px;height:34px;display:flex;align-items:center;justify-content:center;gap:6px;font:700 15px/1 var(--px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45)}

/* ---------- khung gỗ + bảng xanh ---------- */
.fblock{flex:none;height:218px;display:flex;gap:6px;margin-bottom:6px}
.ffr{position:relative;flex:none;width:218px;height:218px;padding:4px;background-color:#8e5528;background-image:var(--woodL);background-size:192px 120px;
  box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 rgba(255,210,150,.55),inset 0 -3px 0 rgba(50,25,8,.55)}
.ffr canvas{width:210px;height:210px;display:block}
.toast{position:absolute;left:10px;right:10px;bottom:10px;padding:5px 6px 4px;text-align:center;font:700 14px/1.15 var(--px);color:var(--ink);background:#ffd95a;box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 #fff2a6;display:none;pointer-events:none;z-index:3}
.toast.win{background:#6fe06a;box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 #c8ffc2}
.toast.bad{background:#ff6a60;color:#fff;box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 #ffb0a8}
.toast.show{display:block}
.side{flex:none;width:116px;display:flex;flex-direction:column;gap:8px}
.cbtn{flex:none;height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;font:700 15px/1 var(--px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4);white-space:nowrap}
.cbtn.hint{color:#fff}
.side.busy .cbtn.run,.side.busy .cbtn.beat{filter:saturate(.35) brightness(.75)}
.chalk{background-color:#1d5a44;background-image:var(--chalk);background-size:48px 48px;image-rendering:pixelated;box-shadow:inset 0 0 0 2px var(--ink),inset 0 3px 0 rgba(0,0,0,.28)}
.clock{flex:none;height:26px;display:flex;align-items:center;padding:0 6px 0 8px;gap:6px}
.clock .l{font:700 11px/1 var(--px);color:#9fd3b8}
.clock .v{font:400 24px/1 var(--mono);color:#ffd95a;min-width:26px}
.clock .lamps{margin-left:auto;display:flex;gap:4px}
.lamp{width:14px;height:14px;background:#12382c;box-shadow:0 0 0 2px var(--ink);font:400 13px/14px var(--mono);color:#4f8a73;text-align:center}
.lamp.on{background:#5ff0ff;color:#06323a;box-shadow:0 0 0 2px var(--ink),0 0 0 3px #bdfaff}

.low{flex:none;height:356px;display:flex;gap:6px}
.pan{height:356px;padding:6px;position:relative;background-color:#8e5528;background-image:var(--woodL);background-size:192px 120px;image-rendering:pixelated;
  box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 rgba(255,210,150,.55),inset 0 -3px 0 rgba(50,25,8,.55)}
.pan.p-prog{width:176px}.pan.p-pal{width:158px}
.pan .rv{position:absolute;width:4px;height:4px;background:#d8cdb8;box-shadow:0 0 0 1px var(--ink)}
.pan .rv.a{left:1px;top:1px}.pan .rv.b{right:1px;top:1px}.pan .rv.c{left:1px;bottom:1px}.pan .rv.d{right:1px;bottom:1px}
.board{height:100%;padding:3px 5px 4px;display:flex;flex-direction:column;overflow:hidden}
.bh{flex:none;height:24px;display:flex;align-items:center;gap:5px;padding-bottom:2px}
.bh .tt{font:700 12px/1 var(--px);color:#e8ffe0;white-space:nowrap;letter-spacing:.2px}
.bh .ct{font:400 21px/1 var(--mono);color:#ffd95a;margin-left:auto}
.bh .del{flex:none;width:26px;height:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--ink),0 3px 0 2px var(--ink),inset 0 2px 0 var(--hi),inset 0 -3px 0 var(--lo);margin-bottom:3px}
.bh .del:active{transform:translateY(2px)}
.pan.flash{animation:redfl .5s steps(2) 1}
@keyframes redfl{0%,100%{box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 rgba(255,210,150,.55),inset 0 -3px 0 rgba(50,25,8,.55)}
  25%,75%{box-shadow:0 0 0 4px #ff3b30,inset 0 0 0 4px #ff3b30,inset 0 -3px 0 rgba(50,25,8,.55)}}

.rows{flex:none;display:flex;flex-direction:column;gap:2px}
.row{height:29px;display:flex;gap:3px;cursor:pointer}
.tab{flex:none;width:17px;background:#0e3a2b;box-shadow:inset 0 0 0 2px var(--ink);font:400 16px/29px var(--mono);color:#8fc9ac;text-align:center}
.strip{flex:1;min-width:0;display:flex;align-items:center;padding:0 5px;overflow:hidden;white-space:pre;
  background:#f6e8c0;box-shadow:inset 0 0 0 2px var(--ink),inset 0 4px 0 #fffbe8,inset 0 -4px 0 #d9c58e;
  font:400 22px/1 var(--mono);color:#2a1c0e}
.strip.empty{background:transparent;box-shadow:none;border:2px dashed #6fae93}
.strip.lock{background:#a9aab4;box-shadow:inset 0 0 0 2px var(--ink),inset 0 4px 0 #d2d3dc,inset 0 -4px 0 #7c7d88;color:#4a4b58}
.row.sel .tab{background:#ffd95a;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.row.sel .strip{box-shadow:inset 0 0 0 2px var(--ink),0 0 0 2px #fff,inset 0 4px 0 #fffbe8,inset 0 -4px 0 #d9c58e;animation:selb .7s steps(1) infinite}
.row.sel .strip.empty{border-color:#fff;box-shadow:0 0 0 2px #ffd95a;animation:selb .7s steps(1) infinite}
@keyframes selb{0%{outline:2px solid #ffd95a;outline-offset:0}50%{outline:2px solid #fff;outline-offset:0}}
.strip.on{background:#ffb02e;box-shadow:inset 0 0 0 2px var(--ink),0 0 0 2px #fff6c0,inset 0 4px 0 #ffe08a,inset 0 -4px 0 #d77a10}
.row.run .tab{background:#ffb02e;color:var(--ink)}
.strip .lm{color:#0b6f86}.strip .rm{color:#0b6f86}.strip .wt{color:#8a5200}.strip .fn{color:#1a7a2e}.strip .pu{color:#7a6a4a}
.strip.on .pu{color:#5a3a10}
.strip .lk{margin-right:5px}

/* kho khối lệnh */
.pal{flex:1;min-height:0;overflow:hidden;padding:0 1px}
.gl{display:flex;align-items:center;gap:5px;margin:3px 0 0;font:700 11px/1 var(--px);color:#a8dcc0;letter-spacing:.4px}
.gl::after{content:"";flex:1;height:2px;background:#2f7a5c}
.brick{position:relative;display:flex;align-items:center;width:100%;height:30px;margin-top:12px;padding:0 0 0 9px;text-align:left;cursor:pointer;
  font:400 20px/1 var(--mono);color:var(--ink);white-space:nowrap;
  background:var(--c);box-shadow:0 0 0 2px var(--ink),0 3px 0 2px var(--ink),inset 0 3px 0 var(--hi),inset 0 -4px 0 var(--lo);transition:transform .05s}
.brick::before{content:"";position:absolute;left:5px;right:5px;top:-10px;height:8px;background:var(--stud) 0 0 repeat-x;background-size:16px 8px;image-rendering:pixelated}
.brick:active{transform:translateY(2px)}
.brick.cy{--c:#38c6de;--hi:#9aeefa;--lo:#1b8aa4;--stud:var(--st-cy)}
.brick.yl{--c:#ffc933;--hi:#fff09a;--lo:#cf8f10;--stud:var(--st-yl)}
.brick.gr{--c:#4cc24f;--hi:#a6f2a0;--lo:#2a8a35;--stud:var(--st-gr)}
.brick.pu{--c:#a070e6;--hi:#d9c4ff;--lo:#6a3fb4;--stud:var(--st-pu)}
.brick.lit{box-shadow:0 0 0 2px #fff,0 0 0 4px #ff9a2e,0 3px 0 4px var(--ink),inset 0 3px 0 var(--hi),inset 0 -4px 0 var(--lo);animation:litp .5s steps(1) infinite}
@keyframes litp{0%{filter:brightness(1.18)}50%{filter:brightness(1.0)}}
.brick .ed{position:absolute;right:3px;top:3px;bottom:5px;width:24px;display:flex;align-items:center;justify-content:center;background:rgba(0,40,10,.28);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.brick .ed:active{background:rgba(255,255,255,.4)}
.newfn{margin-top:14px;width:100%;height:30px;display:flex;align-items:center;justify-content:center;gap:6px;color:#e8ffe0;font:700 13px/1 var(--px);
  border:2px dashed #7fc4a6;background:rgba(255,255,255,.05)}
.newfn:active{background:rgba(255,255,255,.2)}
.empty-note{margin-top:10px;font:400 12px/1.3 var(--px);color:#8fbfa8;padding:0 2px}

/* xưởng hàm */
.plate{flex:none;height:56px;position:relative;padding:7px 9px;box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 4px #d9a441,inset 0 0 0 6px var(--ink);background-color:#1d5a44;background-image:var(--chalk);background-size:48px 48px}
.plate .k{font:400 21px/17px var(--mono);color:#ff9ad0;display:block;margin-top:3px}
.plate .nm{font:400 19px/21px var(--mono);color:#ffe36a;display:block;white-space:nowrap}
.plate .nm i{font-style:normal;color:#cfe8d8}
.runb{flex:none;height:44px;display:flex;align-items:center;justify-content:center;gap:7px;font:700 15px/1 var(--px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.side.busy .runb{filter:saturate(.35) brightness(.75)}
.result{flex:1;min-height:0;padding:7px 8px;display:flex;flex-direction:column;gap:5px}
.result .k{font:700 11px/1 var(--px);color:#9fd3b8;letter-spacing:.4px}
.result .m{font:700 14px/1.2 var(--px);color:#fff6e0}
.result .ok{display:flex;gap:6px;align-items:center;font:700 14px/1 var(--px);margin-top:auto}
.result .ok.good{color:#7cff86}.result .ok.badr{color:#ff8a80}

/* lớp phủ xưởng trên điện thoại 1 */
.screen>.ovwrap{position:absolute;left:0;top:0;width:360px;height:640px;overflow:hidden;overflow:clip;z-index:20;pointer-events:none}
.ws-ov{position:absolute;left:0;top:0;width:360px;height:640px;pointer-events:none;padding:8px 10px 8px;display:flex;flex-direction:column;
  background-color:#b87638;background-image:var(--wood);background-size:192px 120px;transform:translateY(100%);transition:transform .3s steps(6)}
.ws-ov.open{transform:translateY(0);pointer-events:auto}
.ws-ov>*{position:relative;z-index:2}

.fb .strip{font-size:15px}.fb .tab{font-size:12px}.fb .brick{font-size:15px}.fb .bh .ct{font-size:16px}.fb .plaque .n{font-size:20px}
.fb .clock .v{font-size:17px}.fb .lamp{font-size:10px}.fb .plate .k,.fb .plate .nm{font-size:15px}.fb .gl,.fb .bh .tt{font-size:11px}

@media (max-width:420px){ body{padding:44px 0 24px;gap:48px} }
</style>
</head>
<body>

<div class="unit"><div class="cap">1 · Màn chơi</div>
 <div class="phone">
  <div class="screen" id="s1">
    <div class="deco" id="deco1"></div>
    <div class="top">
      <div class="plaque"><span class="n">2.4</span><span class="d"></span><span class="t">Rẽ phải</span></div>
      <div class="stars" id="stars"></div>
      <button class="bt g-pu menu" id="menu" aria-label="Menu"><span data-i="menu" data-s="2"></span></button>
    </div>
    <div class="fblock">
      <div class="ffr"><canvas id="field" class="tex"></canvas><div class="toast" id="toast"></div></div>
      <div class="side" id="side">
        <button class="bt g-gr cbtn run" id="b-run"><span data-i="play" data-s="2"></span>Chạy</button>
        <button class="bt g-yl cbtn beat" id="b-beat" style="color:#3a2400;text-shadow:0 2px 0 rgba(255,255,255,.4)"><span data-i="step" data-s="2"></span>Nhịp</button>
        <button class="bt g-bl cbtn rst" id="b-rst"><span data-i="reset" data-s="2"></span>Lại</button>
        <button class="bt g-pu cbtn hint" id="b-hint"><span data-i="bulb" data-s="2"></span>Gợi ý</button>
        <div class="clock chalk"><span class="l">NHỊP</span><span class="v" id="clock">0</span>
          <span class="lamps"><span class="lamp" id="lampL">T</span><span class="lamp" id="lampR">P</span></span></div>
      </div>
    </div>
    <div class="low">
      <div class="pan p-prog" id="pan-main"><i class="rv a"></i><i class="rv b"></i><i class="rv c"></i><i class="rv d"></i>
        <div class="board chalk">
          <div class="bh"><span class="tt">CHƯƠNG TRÌNH</span><span class="ct" id="ct-main">5/10</span>
            <button class="bt g-rd del" id="del-main" aria-label="Xóa dòng"><span data-i="del" data-s="1" data-c="#fff"></span></button></div>
          <div class="rows" id="rows-main"></div>
        </div></div>
      <div class="pan p-pal"><i class="rv a"></i><i class="rv b"></i><i class="rv c"></i><i class="rv d"></i>
        <div class="board chalk"><div class="bh"><span class="tt">KHỐI LỆNH</span></div><div class="pal" id="pal-main"></div></div></div>
    </div>
    <div class="ovwrap"><div class="ws-ov" id="ov"></div></div>
  </div>
 </div>
</div>

<div class="unit"><div class="cap">2 · Xưởng hàm (đang mở turn_right)</div>
 <div class="phone"><div class="screen" id="s2"></div></div>
</div>

<script>
/* ============================================================
   Vẽ pixel art bằng code (Painter theo cách của js/gfx.js)
   ============================================================ */
var K={ink:'#1b120a'};
function Painter(w,h){this.w=w;this.h=h;this.buf=new Array(w*h).fill(null);}
Painter.prototype={
  px:function(x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<this.w&&y<this.h)this.buf[y*this.w+x]=c;return this;},
  get:function(x,y){if(x<0||y<0||x>=this.w||y>=this.h)return null;return this.buf[y*this.w+x];},
  rect:function(x,y,w,h,c){for(var j=0;j<h;j++)for(var i=0;i<w;i++)this.px(x+i,y+j,c);return this;},
  ell:function(cx,cy,rx,ry,c){for(var y=Math.floor(cy-ry-1);y<=Math.ceil(cy+ry+1);y++)for(var x=Math.floor(cx-rx-1);x<=Math.ceil(cx+rx+1);x++){var dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.px(x,y,c);}return this;},
  map:function(rows,pal,ox,oy){ox=ox||0;oy=oy||0;var s=this;rows.forEach(function(row,y){for(var x=0;x<row.length;x++){var c=pal[row.charAt(x)];if(c)s.px(ox+x,oy+y,c);}});return this;},
  blit:function(q,ox,oy){for(var y=0;y<q.h;y++)for(var x=0;x<q.w;x++){var c=q.get(x,y);if(c)this.px(ox+x,oy+y,c);}return this;},
  outline:function(c){var add=[];for(var y=0;y<this.h;y++)for(var x=0;x<this.w;x++){if(this.get(x,y))continue;if(this.get(x-1,y)||this.get(x+1,y)||this.get(x,y-1)||this.get(x,y+1))add.push([x,y]);}
    for(var i=0;i<add.length;i++)this.px(add[i][0],add[i][1],c||K.ink);return this;},
  canvas:function(){var cv=document.createElement('canvas');cv.width=this.w;cv.height=this.h;var g=cv.getContext('2d'),id=g.createImageData(this.w,this.h);
    for(var i=0;i<this.buf.length;i++){var c=this.buf[i];if(!c)continue;if(c.length===4)c='#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];var n=parseInt(c.slice(1),16);id.data[i*4]=n>>16;id.data[i*4+1]=(n>>8)&255;id.data[i*4+2]=n&255;id.data[i*4+3]=255;}
    g.putImageData(id,0,0);return cv;}
};
function rot90(p){var q=new Painter(p.w,p.h);for(var y=0;y<p.h;y++)for(var x=0;x<p.w;x++){var c=p.get(x,y);if(c)q.px(p.h-1-y,x,c);}return q;}
function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}

/* ---------- chất liệu: gỗ, bảng xanh, stud ---------- */
function texWood(pals,seed){
  var W=96,H=60,p=new Painter(W,H),r=rng(seed);
  for(var k=0;k<3;k++){
    var y0=k*20,b=pals[k];
    p.rect(0,y0,W,20,b[0]);

/* ============================================================
   LÕI MÔ PHỎNG (không đụng DOM) — luật nhịp
   ============================================================ */
var SIM=(function(){
  var DX=[0,1,0,-1],DY=[-1,0,1,0];
  function has(o,k){return Object.prototype.hasOwnProperty.call(o,k);}
  function isWall(L,x,y){for(var i=0;i<L.walls.length;i++)if(L.walls[i][0]===x&&L.walls[i][1]===y)return true;return false;}
  function blocked(L,x,y){return x<0||y<0||x>=L.w||y>=L.h||isWall(L,x,y);}
  function convAt(L,x,y){for(var i=0;i<L.conv.length;i++)if(L.conv[i].x===x&&L.conv[i].y===y)return L.conv[i];return null;}
  function nm(t){var m=/^(\w+)\(\)$/.exec(t||'');return m?m[1]:null;}
  // trải chương trình thành các bước; mỗi bước {kind,top(dòng gốc),fn(hàm đang chạy|null),wheel,beat}
  function plan(root,funcs){
    var out=[],pend={L:false,R:false},guard=0;
    function call(name,top,depth,fn){
      if(++guard>500)return false;
      if(name==='left_move'){pend.L=true;out.push({kind:'prim',top:top,fn:fn,wheel:'L',beat:null});return true;}
      if(name==='right_move'){pend.R=true;out.push({kind:'prim',top:top,fn:fn,wheel:'R',beat:null});return true;}
      if(name==='wait'){out.push({kind:'wait',top:top,fn:fn,wheel:null,beat:{L:pend.L,R:pend.R}});pend={L:false,R:false};return true;}
      var f=has(funcs,name)?funcs[name]:null;
      if(!f||depth>=6){out.push({kind:'error',top:top,fn:fn,wheel:null,beat:null,msg:!f?('Chưa có hàm '+name+'()'):'Hàm gọi vòng quanh'});return false;}
      out.push({kind:'call',top:top,fn:name,wheel:null,beat:null});
      for(var i=0;i<f.length;i++){var n2=nm(f[i]);if(!n2)continue;if(!call(n2,top,depth+1,name))return false;}
      return true;
    }
    for(var i=0;i<root.length;i++){var n=nm(root[i]);if(!n)continue;if(!call(n,i,0,null))break;}
    out.dangling=pend.L||pend.R;return out;
  }
  // một nhịp: hai bánh=tiến 1 ô, chỉ trái=quay phải, chỉ phải=quay trái; băng chuyền đẩy sau 2 nhịp đứng trên nó
  function applyBeat(L,st,beat){
    var s={x:st.x,y:st.y,d:st.d,dw:st.dw||0},ev=[],moved=false;
    if(beat.L&&beat.R){
      var nx=s.x+DX[s.d],ny=s.y+DY[s.d];
      if(blocked(L,nx,ny))ev.push({t:'bump',d:s.d});
      else{ev.push({t:'move',x0:s.x,y0:s.y,x1:nx,y1:ny,push:false});s.x=nx;s.y=ny;moved=true;}
    }else if(beat.L){ev.push({t:'turn',d0:s.d,d1:(s.d+1)%4,wheel:'L'});s.d=(s.d+1)%4;}
    else if(beat.R){ev.push({t:'turn',d0:s.d,d1:(s.d+3)%4,wheel:'R'});s.d=(s.d+3)%4;}
    else ev.push({t:'idle'});
    var c=convAt(L,s.x,s.y);
    if(!c)s.dw=0;
    else{
      s.dw=moved?1:s.dw+1;
      if(s.dw>=2){
        var px=s.x+DX[c.d],py=s.y+DY[c.d];
        if(blocked(L,px,py)){ev.push({t:'bump',d:c.d});s.dw=0;}
        else{ev.push({t:'move',x0:s.x,y0:s.y,x1:px,y1:py,push:true});s.x=px;s.y=py;s.dw=convAt(L,px,py)?1:0;}
      }
    }
    return {state:s,events:ev};
  }
  function runAll(L,root,funcs){
    var steps=plan(root,funcs),st={x:L.start.x,y:L.start.y,d:L.start.d,dw:0},beats=0,flagBeat=0;
    for(var i=0;i<steps.length;i++){var s=steps[i];if(!s.beat)continue;beats++;st=applyBeat(L,st,s.beat).state;
      if(L.flag&&!flagBeat&&st.x===L.flag.x&&st.y===L.flag.y){flagBeat=beats;break;}}
    return {state:st,beats:beats,atFlag:!!(L.flag&&st.x===L.flag.x&&st.y===L.flag.y),steps:steps};
  }
  return {DX:DX,DY:DY,plan:plan,applyBeat:applyBeat,runAll:runAll,blocked:blocked,isWall:isWall,convAt:convAt};
})();

var convCache={};
function makeConv(d,frame){

var FIELDS=[];
function Field(cv,L,scale,toastEl,lamps){
  this.L=L;this.cv=cv;cv.width=L.w*T;cv.height=L.h*T;
  this.g=cv.getContext('2d');this.g.imageSmoothingEnabled=false;
  this.toast=toastEl;this.lamps=lamps;this.lst={L:-1,R:-1};this.toastT=0;
  this.clearFx();this.setState(this.initState());FIELDS.push(this);
}
Field.prototype={
  initState:function(){var s=this.L.start;return {x:s.x,y:s.y,d:s.d,dw:0};},
  setState:function(st){this.vis={x:st.x,y:st.y,d:st.d,hop:0,dx:0,dy:0};},
  clearFx:function(){this.wh={L:0,R:0};this.parts=[];this.bounce=0;this.flash=0;this.hintUntil=0;this.hintPath=null;this.hideToast();},
  arm:function(s){if(this.wh[s]<1)this.wh[s]=1;},
  atFlag:function(st){return !!(this.L.flag&&st.x===this.L.flag.x&&st.y===this.L.flag.y);},
  showToast:function(text,kind,ms){var t=this.toast;if(!t)return;t.textContent=text;t.className='toast show '+(kind||'');clearTimeout(this.toastT);if(ms)this.toastT=setTimeout(function(){t.className='toast';},ms);},
  hideToast:function(){if(!this.toast)return;clearTimeout(this.toastT);this.toast.className='toast';},
  burst:function(cx,cy,n,cols,sp){for(var i=0;i<n;i++){var a=Math.random()*6.283,s=(sp||1)*(.3+Math.random()*.9);
    this.parts.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.5,life:28+Math.random()*30,c:cols[i%cols.length]});}},
  celebrate:function(){this.bounce=performance.now()+900;var f=this.L.flag;this.burst(f.x*T+7,f.y*T+5,60,['#ffd23f','#fff6e3','#38c6de','#ff7ac8','#6fe06a','#ff5a4a'],1.2);},
  hint:function(){
    var L=this.L,s=L.start,seen={},q=[[s.x,s.y,null]],head=0,end=null;seen[s.x+','+s.y]=1;
    while(head<q.length){var c=q[head++];if(L.flag&&c[0]===L.flag.x&&c[1]===L.flag.y){end=c;break;}
      for(var d=0;d<4;d++){var nx=c[0]+SIM.DX[d],ny=c[1]+SIM.DY[d];if(SIM.blocked(L,nx,ny)||seen[nx+','+ny])continue;seen[nx+','+ny]=1;q.push([nx,ny,c]);}}
    var path=[];while(end){path.push({x:end[0],y:end[1]});end=end[2];}
    this.hintPath=path;this.hintUntil=performance.now()+3500;
  },
  draw:function(now){
    var g=this.g,L=this.L,TL=tiles(),cf=Math.floor(now/130)&3,ff=Math.floor(now/180)&3;
    g.clearRect(0,0,this.cv.width,this.cv.height);
    for(var y=0;y<L.h;y++)for(var x=0;x<L.w;x++){
      var c=SIM.convAt(L,x,y),t;
      if(c)t=makeConv(c.d,cf);else if(SIM.isWall(L,x,y))t=TL.wall;
      else if(L.flag&&x===L.flag.x&&y===L.flag.y)t=TL.pad;
      else t=TL.rug[(x+y*2)&3];
      g.drawImage(t,x*T,y*T);
    }
    if(this.hintUntil>now&&this.hintPath){
      this.hintPath.forEach(function(q,i){if((((now/200)|0)+i)%2===0){g.fillStyle='#fff6d0';g.fillRect(q.x*T+6,q.y*T+6,2,2);}});
    }
    if(L.flag){var fy=this.bounce>now?-Math.round(Math.abs(Math.sin((this.bounce-now)/80))*3):0;g.drawImage(TL.flags[ff],L.flag.x*T,L.flag.y*T+fy);}
    var v=this.vis,rx=Math.round(v.x*T+v.dx),ry=Math.round(v.y*T+v.dy);
    g.fillStyle='rgba(0,30,10,.35)';g.fillRect(rx+2,ry+12,10,2);
    var ph=(now/90|0)&1;
    g.drawImage(makeRobot(v.d,this.wh.L,this.wh.R,ph),rx-1,ry-1-Math.round(v.hop));
    if(this.flash>now){g.fillStyle='rgba(255,60,50,.32)';g.fillRect(0,0,this.cv.width,this.cv.height);}
    for(var i=this.parts.length-1;i>=0;i--){var q2=this.parts[i];q2.life--;q2.vy+=.05;q2.x+=q2.vx;q2.y+=q2.vy;
      if(q2.life<=0){this.parts.splice(i,1);continue;}g.fillStyle=q2.c;g.fillRect(Math.round(q2.x),Math.round(q2.y),1,1);}
    if(this.lamps){var wl=this.wh.L>0?1:0,wr=this.wh.R>0?1:0;
      if(wl!==this.lst.L){this.lst.L=wl;this.lamps.L.classList.toggle('on',!!wl);}
      if(wr!==this.lst.R){this.lst.R=wr;this.lamps.R.classList.toggle('on',!!wr);}}
  }
};
(function loop(now){FIELDS.forEach(function(f){f.draw(now||performance.now());});requestAnimationFrame(loop);})();

/* ============================================================
   RUNNER: chạy theo bước, nhịp, hoạt ảnh
   ============================================================ */
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
var ease=function(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
function Runner(F,cfg){
  var plan=null,cursor=0,busy=false,rid=0,st=F.initState(),beats=0;
  function tween(ms,my,fn){return new Promise(function(res){var t0=performance.now();
    (function f(){if(my!==rid){res();return;}var k=Math.min(1,(performance.now()-t0)/ms);fn(k);if(k<1)setTimeout(f,16);else res();})();});}
  function reset(){rid++;busy=false;plan=null;cursor=0;beats=0;st=F.initState();F.setState(st);F.clearFx();
    cfg.onBeat(0);cfg.onStep(null);cfg.onBusy(false);}
  async function doBeat(beat,my){
    var res=SIM.applyBeat(F.L,st,beat);
    F.wh.L=beat.L?2:0;F.wh.R=beat.R?2:0;
    for(var i=0;i<res.events.length;i++){
      var e=res.events[i],v=F.vis;
      if(e.t==='move'){
        if(e.push)await sleep(70);
        await tween(e.push?240:380,my,function(k){var k2=ease(k);v.x=e.x0+(e.x1-e.x0)*k2;v.y=e.y0+(e.y1-e.y0)*k2;});
        if(my!==rid)return;v.x=e.x1;v.y=e.y1;
      }else if(e.t==='turn'){
        await tween(340,my,function(k){v.hop=Math.sin(k*Math.PI)*2;if(k>.5)v.d=e.d1;
          if(Math.random()<.4)F.burst(v.x*T+(e.wheel==='L'?3:11),v.y*T+12,1,['#fff6e3','#7fe8ff'],.6);});
        if(my!==rid)return;v.d=e.d1;v.hop=0;
      }else if(e.t==='bump'){
        var ddx=SIM.DX[e.d],ddy=SIM.DY[e.d];
        await tween(280,my,function(k){var a=Math.sin(k*Math.PI*3)*(1-k)*3;v.dx=ddx*a;v.dy=ddy*a;if(k>.1&&k<.6)F.flash=performance.now()+120;});
        v.dx=0;v.dy=0;
      }else await sleep(320);
      if(my!==rid)return;
    }
    st=res.state;F.wh.L=0;F.wh.R=0;
    return res;
  }
  function finish(){
    busy=false;cfg.onBusy(false);cfg.onStep(null);
    cfg.onEnd(st,{atFlag:F.atFlag(st),dangling:!!(plan&&plan.dangling),beats:beats});
  }
  async function exec(untilBeat){
    if(busy)return;
    if(!plan||cursor>=plan.length){reset();plan=SIM.plan(cfg.root(),cfg.funcs());cursor=0;
      if(!plan.length){cfg.onEmpty&&cfg.onEmpty();plan=null;return;}}
    busy=true;cfg.onBusy(true);F.hideToast();var my=++rid;
    while(cursor<plan.length){
      var s=plan[cursor++];
      cfg.onStep(s);
      if(s.wheel)F.arm(s.wheel);
      if(s.kind==='error'){busy=false;cfg.onBusy(false);cfg.onStep(null);F.showToast(s.msg,'bad',2500);plan=null;return;}
      await sleep(s.beat?150:100);if(my!==rid)return;
      if(s.beat){
        var r=await doBeat(s.beat,my);if(my!==rid)return;
        beats++;cfg.onBeat(beats);
        if(cfg.flag&&F.atFlag(st)){finish();return;}
        if(cursor>=plan.length){finish();return;}
        if(untilBeat){busy=false;cfg.onBusy(false);return;}
      }
    }
    finish();
  }
  return {run:function(){return exec(false);},beat:function(){return exec(true);},reset:reset,
    invalidate:function(){if(plan||busy)reset();},get busy(){return busy;},get state(){return {x:st.x,y:st.y,d:st.d,beats:beats,busy:busy,cursor:cursor,planLen:plan?plan.length:0};}};
}

/* ============================================================
   DỮ LIỆU CHUNG + EDITOR + KHO KHỐI LỆNH
   ============================================================ */
var MAXL=10;
var PROG=['move()','move()','turn_right()','move()','move()'];
var FUNCS={move:['left_move()','right_move()','wait()'],turn_right:['left_move()','wait()']};
var FORDER=['move','turn_right'];
var LEVEL={w:5,h:5,start:{x:1,y:4,d:0},flag:{x:3,y:2},walls:[[3,1],[0,2]],conv:[{x:4,y:3,d:0},{x:4,y:4,d:0}]};
var TEST_LEVEL={w:3,h:3,start:{x:1,y:1,d:0},flag:null,walls:[],conv:[]};
var EDITORS=[],RUNNERS=[];
function changed(){RUNNERS.forEach(function(r){r.invalidate();});EDITORS.forEach(function(e){e.render();});}

function colorize(t){
  var m=/^(\w+)\(\)$/.exec(t);
  if(!m)return t;
  var cls=m[1]==='left_move'?'lm':m[1]==='right_move'?'rm':m[1]==='wait'?'wt':'fn';
  return '<span class="'+cls+'">'+m[1]+'</span><span class="pu">()</span>';
}
function Editor(host,getArr,panEl,ctEl,delBtn){
  var rows=[],strips=[],sel=Math.min(getArr().length,MAXL-1),runTop=-1,ed=this;
  for(var i=0;i<MAXL;i++){
    var r=document.createElement('div');r.className='row';
    var tb=document.createElement('div');tb.className='tab';tb.textContent=i+1;
    var s=document.createElement('div');s.className='strip empty';
    r.appendChild(tb);r.appendChild(s);host.appendChild(r);rows.push(r);strips.push(s);
    (function(i){r.addEventListener('click',function(){sel=i;ed.render();});})(i);
  }
  this.render=function(){
    var arr=getArr();
    for(var i=0;i<MAXL;i++){
      var t=arr[i];
      strips[i].className='strip'+(t?'':' empty')+(runTop===i?' on':'');
      strips[i].innerHTML=t?colorize(t):'';
      rows[i].classList.toggle('sel',i===sel);rows[i].classList.toggle('run',runTop===i);
    }
    ctEl.textContent=arr.length+'/'+MAXL;
  };
  this.flash=function(){panEl.classList.remove('flash');void panEl.offsetWidth;panEl.classList.add('flash');};
  this.insert=function(txt){
    var arr=getArr();
    if(arr.length>=MAXL){this.flash();return false;}
    var at=Math.min(sel,arr.length);arr.splice(at,0,txt);sel=Math.min(at+1,MAXL-1);changed();return true;
  };
  this.del=function(){
    var arr=getArr();if(!arr.length)return;
    if(sel<arr.length)arr.splice(sel,1);else{arr.pop();sel=arr.length;}
    changed();
  };
  this.setRun=function(top){runTop=top==null?-1:top;this.render();
    if(runTop>=0&&runTop<MAXL)sel=Math.min(sel,MAXL-1);};
  this.rebind=function(g){getArr=g;sel=Math.min(getArr().length,MAXL-1);runTop=-1;this.render();};
  delBtn.addEventListener('click',function(){ed.del();});
  EDITORS.push(this);this.render();
}
function Palette(host,cfg){
  var bricks={},self=this;
  this.build=function(){
    host.innerHTML='';bricks={};
    var g1=document.createElement('div');g1.className='gl';g1.textContent='GỐC';host.appendChild(g1);
    [['left_move','cy'],['right_move','cy'],['wait','yl']].forEach(function(b){
      var d=document.createElement('div');d.className='brick '+b[1];d.setAttribute('role','button');d.innerHTML='<span>'+b[0]+'</span>';
      d.addEventListener('click',function(){cfg.onPick(b[0]+'()');});host.appendChild(d);bricks[b[0]]=d;});
    var g2=document.createElement('div');g2.className='gl';g2.style.marginTop='10px';g2.textContent='HÀM CỦA EM';host.appendChild(g2);
    var list=cfg.fns();
    list.forEach(function(n){
      var d=document.createElement('div');d.className='brick gr';d.setAttribute('role','button');
      d.innerHTML='<span>'+n+'()</span>';
      var e=document.createElement('span');e.className='ed';e.setAttribute('aria-label','Sửa hàm '+n);e.appendChild(ico('edit','#0e3a12',2));
      e.addEventListener('click',function(ev){ev.stopPropagation();cfg.onEdit&&cfg.onEdit(n);});
      d.appendChild(e);d.addEventListener('click',function(){cfg.onPick(n+'()');});host.appendChild(d);bricks[n]=d;});
    if(!list.length){var nt=document.createElement('div');nt.className='empty-note';nt.textContent='Chưa có hàm nào khác để gọi.';host.appendChild(nt);}
    if(cfg.newFn){var nb=document.createElement('button');nb.className='newfn';nb.appendChild(ico('plus','#e8ffe0',1));
      nb.appendChild(document.createTextNode('Hàm mới'));nb.addEventListener('click',cfg.newFn);host.appendChild(nb);}
  };
  this.setLit=function(name){for(var k in bricks)bricks[k].classList.toggle('lit',k===name);};
  this.build();
}

function buildWorkshop(host,fn0,onBack){
  var fn=fn0;
  host.insertAdjacentHTML('beforeend',
   '<div class="deco"></div>'+
   '<div class="top"><button class="bt g-or back"><span data-i="back" data-s="2"></span>Về sân</button>'+
     '<div class="plaque"><span class="t" style="font-size:19px;letter-spacing:1px">XƯỞNG HÀM</span></div></div>'+
   '<div class="fblock">'+
     '<div class="ffr"><canvas class="tex"></canvas><div class="toast"></div></div>'+
     '<div class="side">'+
       '<div class="plate"><span class="k">def</span><span class="nm"></span></div>'+
       '<button class="bt g-gr runb"><span data-i="play" data-s="2"></span>Thử hàm</button>'+
       '<div class="result chalk"><span class="k">KẾT QUẢ</span><span class="m"></span><span class="ok"></span></div>'+
     '</div></div>'+
   '<div class="low">'+
     '<div class="pan p-prog"><i class="rv a"></i><i class="rv b"></i><i class="rv c"></i><i class="rv d"></i>'+
       '<div class="board chalk"><div class="bh"><span class="tt">THÂN HÀM</span><span class="ct">0/10</span>'+
         '<button class="bt g-rd del" aria-label="Xóa dòng"><span data-i="del" data-s="1" data-c="#fff"></span></button></div><div class="rows"></div></div></div>'+
     '<div class="pan p-pal"><i class="rv a"></i><i class="rv b"></i><i class="rv c"></i><i class="rv d"></i>'+
       '<div class="board chalk"><div class="bh"><span class="tt">KHỐI LỆNH</span></div><div class="pal"></div></div></div>'+
   '</div>');
  hydrate(host);
  addDeco(host.querySelector('.deco'),decoBase().concat([
    {cv:spritePencil(),s:2,x:349,y:92,rot:7},
    {cv:spriteNote('bulb'),s:2,x:-18,y:106,rot:-8}
  ]));
  var $=function(s){return host.querySelector(s);};
  var side=$('.side'),nm=$('.plate .nm'),resM=$('.result .m'),resOk=$('.result .ok');
  var F=new Field($('.ffr canvas'),TEST_LEVEL,5,$('.toast'),null);
  var ed=new Editor($('.rows'),function(){return FUNCS[fn];},$('.p-prog'),$('.p-prog .ct'),$('.p-prog .del'));
  var pal=new Palette($('.pal'),{
    fns:function(){return FORDER.filter(function(n){return n!==fn;});},
    onPick:function(t){ed.insert(t);}
  });
  function describe(st){
    var s0=TEST_LEVEL.start,dx=st.x-s0.x,dy=st.y-s0.y,dd=(st.d-s0.d+4)%4,moved=Math.abs(dx)+Math.abs(dy),parts=[];
    if(moved===0&&dd===0)return {text:'Robot đứng yên',kind:'stay'};
    if(moved)parts.push('tiến '+moved+' ô');
    if(dd===1)parts.push('quay sang phải');else if(dd===3)parts.push('quay sang trái');else if(dd===2)parts.push('quay đầu');
    var kind=(!moved&&dd===1)?'right':(moved===1&&dx===0&&dy===-1&&dd===0)?'fwd':'other';
    return {text:'Robot '+parts.join(' rồi '),kind:kind};
  }
  function verdict(st){
    var d=describe(st),want=fn==='turn_right'?'right':fn==='move'?'fwd':null;
    resM.textContent=d.text;resOk.innerHTML='';
    if(want){var good=d.kind===want;resOk.className='ok '+(good?'good':'badr');
      resOk.appendChild(ico(good?'check':'cross',good?'#7cff86':'#ff8a80',2));
      resOk.appendChild(document.createTextNode(good?'Đúng tên hàm':'Chưa đúng tên hàm'));}
  }
  function clearResult(){resM.textContent='Bấm "Thử hàm" để xem';resOk.innerHTML='';resOk.className='ok';}
  var R=new Runner(F,{
    root:function(){return FUNCS[fn];},funcs:function(){return FUNCS;},flag:false,
    onStep:function(s){ed.setRun(s?s.top:null);pal.setLit(s&&s.fn?s.fn:null);},
    onBeat:function(){},
    onBusy:function(b){side.classList.toggle('busy',b);},
    onEmpty:function(){resM.textContent='Thân hàm còn trống';resOk.innerHTML='';},
    onEnd:function(st,info){if(info.dangling){resM.textContent='Bánh có lệnh nhưng thiếu wait()';resOk.innerHTML='';resOk.className='ok badr';}else verdict(st);}
  });
  RUNNERS.push(R);
  function instant(){ // kết quả không hoạt ảnh (lúc mở)
    var p=SIM.runAll(TEST_LEVEL,FUNCS[fn],FUNCS);
    if(p.steps.length&&!p.steps.some(function(s){return s.kind==='error';}))verdict(p.state);else clearResult();
  }
  function setFn(n){fn=n;nm.innerHTML=n+'<i>():</i>';ed.rebind(function(){return FUNCS[fn];});pal.build();pal.setLit(null);R.reset();instant();}
  // sửa thân hàm xong thì kết quả cũ không còn đúng
  EDITORS[EDITORS.length-1];
  $('.runb').addEventListener('click',function(){R.run();});
  var back=$('.back');back.addEventListener('click',function(){back.classList.add('pr');setTimeout(function(){back.classList.remove('pr');},120);onBack&&onBack();});
  nm.innerHTML=fn+'<i>():</i>';instant();
  return {F:F,R:R,ed:ed,pal:pal,setFn:setFn,clearResult:clearResult,instant:instant,get fn(){return fn;}};
}
