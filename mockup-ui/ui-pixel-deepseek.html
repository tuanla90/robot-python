<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pixel UI - Học Python qua Robot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@400;500;600;700&family=Baloo+2:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pixel: 'Pixelify Sans','Baloo 2','VT323','Courier New',monospace;
    --code: 'VT323','Courier New',monospace;
    --out:#3b2a3a;
    --outSoft:#6b4a5a;
    --bg:#1e2638;
    --panel:#161a2b;
    --panel2:#222a42;
    --white:#fffaf2;
    --cream:#ffe9b8;
    --yellow:#ffd23f;
    --yellowD:#e8a92a;
    --orange:#f59e42;
    --orangeD:#d0722b;
    --red:#e8485f;
    --redD:#b8304a;
    --green:#5fb34a;
    --greenD:#2f7a3a;
    --greenL:#8fd16a;
    --blue:#4a90d9;
    --blueD:#2f62a8;
    --gray:#a7a9bc;
    --grayD:#6d6f86;
    --grayL:#d8d9e6;
    --sky:#9ed8ff;
    --skyL:#cdeeff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#151929;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:40px;
    padding:24px;
    font-family:var(--pixel);
    color:var(--white);
  }
  .phone{
    width:360px;
    height:640px;
    background:#0b0e19;
    border:4px solid var(--out);
    border-radius:26px;
    box-shadow:0 0 0 4px var(--outSoft),0 12px 0 #00000055,0 20px 40px #000000aa;
    overflow:hidden;
  }
  .screen{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:8px;
    background:var(--bg);
    overflow:hidden;
  }
  /* ---------- LEFT SCREEN ---------- */
  .top-bar{height:36px;display:flex;align-items:center;gap:6px}
  .nav-btn{
    width:36px;height:36px;background:var(--panel);border:2px solid var(--out);
    border-radius:8px;color:var(--yellow);font-size:22px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .nav-btn:active{transform:scale(.93)}
  .title-box{
    flex:1;height:100%;background:var(--panel);border:2px solid var(--out);
    border-radius:8px;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:16px;line-height:1.05;color:var(--white);
    padding:0 4px;overflow:hidden;
  }
  .progress{
    height:22px;background:var(--panel);border:2px solid var(--out);border-radius:6px;
    position:relative;display:flex;align-items:center;overflow:hidden;
  }
  .progress-fill{
    height:100%;width:60%;background:var(--green);
    border-right:2px solid var(--out);
    background-image:linear-gradient(45deg,var(--greenL) 25%,transparent 25%,transparent 50%,var(--greenD) 50%,var(--greenD) 75%,transparent 75%);
    background-size:8px 8px;
  }
  .progress-text{position:absolute;right:6px;font-size:14px;color:var(--white);text-shadow:1px 1px 0 #000}
  .challenge-grid{
    flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;
  }
  .challenge-row{flex:1;display:flex;gap:6px;align-items:stretch}
  .row-label{
    width:18px;background:var(--panel);border:2px solid var(--out);border-radius:6px;
    display:flex;align-items:center;justify-content:center;padding:3px 0;
    font-size:11px;line-height:1;color:var(--grayL);
    writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);
  }
  .challenge-cells{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .challenge-cell{
    background:var(--panel);border:2px solid var(--out);border-radius:6px;
    position:relative;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .08s;
  }
  .challenge-cell.passed{border-color:var(--green)}
  .challenge-cell.open{border-color:var(--orange);animation:blink-border .8s steps(2,start) infinite}
  .challenge-cell.locked{opacity:.7;cursor:not-allowed}
  .challenge-cell.pressed{transform:scale(.95)}
  @keyframes blink-border{0%{border-color:var(--orange)}50%{border-color:var(--yellow)}100%{border-color:var(--orange)}}
  .cell-num{
    position:absolute;top:2px;left:5px;font-size:18px;color:var(--white);
    text-shadow:1px 1px 0 var(--out);
  }
  .cell-stars{position:absolute;bottom:3px;left:3px;display:flex;gap:1px}
  .cell-lock{display:flex;align-items:center;justify-content:center}
  .cell-stars canvas,.cell-lock canvas{image-rendering:pixelated}
  .boss-card{
    height:56px;background:#2a1e2e;border:2px solid var(--out);border-radius:8px;
    display:flex;align-items:center;gap:6px;padding:4px 6px;cursor:not-allowed;opacity:.92;
  }
  .boss-sprite-holder,.boss-lock-holder{display:flex;align-items:center;justify-content:center}
  .boss-sprite-holder canvas{image-rendering:pixelated}
  .boss-lock-holder canvas{image-rendering:pixelated}
  .boss-text{flex:1;color:var(--white)}
  .boss-title{font-size:15px;line-height:1;color:#ffd23f}
  .boss-reward{font-size:12px;color:var(--yellowD);margin-top:3px}
  .library{
    height:30px;display:flex;align-items:center;gap:5px;
    font-size:13px;color:var(--grayL);overflow:hidden;
  }
  .library-label{white-space:nowrap}
  .library .pill{
    background:var(--panel);border:2px solid var(--out);border-radius:6px;
    padding:2px 6px;color:#b4f0dc;white-space:nowrap;
  }
  /* ---------- RIGHT SCREEN ---------- */
  .game-top{height:36px;display:flex;align-items:center;gap:6px}
  .level-title{
    flex:1;height:100%;background:var(--panel);border:2px solid var(--out);
    border-radius:8px;display:flex;align-items:center;padding:0 6px;
    font-size:17px;color:var(--white);overflow:hidden;white-space:nowrap;
  }
  .stars{display:flex;gap:2px;align-items:center}
  .stars canvas{image-rendering:pixelated}
  .menu-btn{
    width:36px;height:36px;background:var(--panel);border:2px solid var(--out);
    border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .menu-btn canvas{image-rendering:pixelated}
  .game-field-wrap{
    height:240px;display:flex;gap:8px;align-items:center;
  }
  .field-canvas-wrap{
    width:240px;height:240px;flex-shrink:0;position:relative;
    background:#0b0e19;border:3px solid var(--out);border-radius:10px;overflow:hidden;
  }
  #field-canvas{display:block;width:240px;height:240px;image-rendering:pixelated}
  .robot-layer{position:absolute;inset:0;pointer-events:none}
  .robot-wrap{
    position:absolute;width:48px;height:44px;left:0;top:194px;
    transition:left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1);
  }
  .robot-wrap img#robot-sprite{
    position:absolute;inset:0;width:48px;height:44px;
    image-rendering:pixelated;transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .wheel-glow{
    position:absolute;width:18px;height:16px;image-rendering:pixelated;
    opacity:0;transition:opacity .1s;
  }
  .wheel-glow.left{left:-3px;top:14px}
  .wheel-glow.right{right:-3px;top:14px}
  .robot-wrap.active-left .wheel-glow.left,
  .robot-wrap.active-right .wheel-glow.right{opacity:1}
  .side-buttons{flex:1;display:flex;flex-direction:column;gap:8px}
  .side-btn{
    height:44px;background:var(--panel);border:3px solid var(--out);
    border-radius:8px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .08s;
  }
  .side-btn canvas{image-rendering:pixelated}
  .side-btn:active{transform:scale(.94)}
  .side-btn.primary{background:var(--greenD)}
  .code-frame{
    height:220px;display:flex;gap:8px;
  }
  .code-col{
    flex:1;background:var(--panel);border:3px solid var(--out);border-radius:8px;
    padding:4px;display:flex;flex-direction:column;gap:3px;overflow:hidden;
  }
  .code-header{
    height:18px;font-size:13px;color:var(--yellow);display:flex;
    justify-content:space-between;align-items:center;padding:0 2px;
  }
  .slots{flex:1;display:flex;flex-direction:column;gap:2px}
  .slot{
    height:19px;line-height:17px;padding:0 4px;font-size:14px;
    font-family:var(--code);background:var(--panel2);border:2px solid #080b14;
    border-radius:4px;color:var(--grayL);white-space:nowrap;overflow:hidden;position:relative;
  }
  .slot.empty{opacity:.35;border-style:dashed;color:var(--gray)}
  .slot.locked{background:#3b2a3a;color:var(--grayD);display:flex;align-items:center;justify-content:center}
  .slot.locked canvas{image-rendering:pixelated;opacity:.8}
  .slot.active{background:var(--orange);color:#1e2638;border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
  .tray{
    height:96px;display:flex;flex-direction:column;gap:5px;
  }
  .tray-row{flex:1;display:flex;gap:5px}
  .tray .pill{
    flex:1;background:var(--panel2);border:3px solid var(--out);border-radius:8px;
    color:var(--grayL);font-size:16px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .08s;font-family:var(--code);
  }
  .tray .pill:active{transform:scale(.94);background:var(--orange);color:#1e2638}
  @media (max-width:820px){
    body{flex-direction:column;align-items:center;gap:24px;padding:16px}
  }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">
    <div class="top-bar">
      <button class="nav-btn" id="prev-chapter">‹</button>
      <div class="title-box">Chuỗi 2 · Xưởng hàm</div>
      <button class="nav-btn" id="next-chapter">›</button>
    </div>
    <div class="progress">
      <div class="progress-fill" style="width:60%"></div>
      <span class="progress-text">6/10</span>
    </div>
    <div class="challenge-grid" id="challenge-grid"></div>
    <div class="boss-card" id="boss-card">
      <div class="boss-sprite-holder" id="boss-sprite"></div>
      <div class="boss-text">
        <div class="boss-title">TRÙM · Đường dài</div>
        <div class="boss-reward">Thưởng: move()</div>
      </div>
      <div class="boss-lock-holder" id="boss-lock"></div>
    </div>
    <div class="library" id="library"></div>
  </div>
</div>

<div class="phone">
  <div class="screen">
    <div class="game-top">
      <div class="level-title">2.4 · turn_right()</div>
      <div class="stars" id="game-stars"></div>
      <button class="menu-btn" id="menu-btn"></button>
    </div>
    <div class="game-field-wrap">
      <div class="field-canvas-wrap" id="field-canvas-wrap">
        <canvas id="field-canvas" width="120" height="120"></canvas>
        <div class="robot-layer">
          <div class="robot-wrap" id="robot-wrap">
            <img id="robot-sprite" alt="robot">
            <img class="wheel-glow left" id="glow-left" alt="">
            <img class="wheel-glow right" id="glow-right" alt="">
          </div>
        </div>
      </div>
      <div class="side-buttons">
        <button class="side-btn primary" id="btn-run"></button>
        <button class="side-btn" id="btn-step"></button>
        <button class="side-btn" id="btn-reset"></button>
        <button class="side-btn" id="btn-light"></button>
      </div>
    </div>
    <div class="code-frame">
      <div class="code-col">
        <div class="code-header">CHÍNH <span>5/8</span></div>
        <div class="slots" id="main-slots"></div>
      </div>
      <div class="code-col">
        <div class="code-header">HÀM <span>7/8</span></div>
        <div class="slots" id="fn-slots"></div>
      </div>
    </div>
    <div class="tray" id="tray"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------- colors
  const C = {
    out:'#3b2a3a', outSoft:'#6b4a5a',
    white:'#fffaf2', cream:'#ffe9b8', creamD:'#f2cf8f',
    yellow:'#ffd23f', yellowD:'#e8a92a', orange:'#f59e42', orangeD:'#d0722b',
    red:'#e8485f', redD:'#b8304a', pink:'#ff8fb1', pinkL:'#ffc4d6', pinkD:'#d9628f', rose:'#d94f86',
    lav:'#b79ced', lavL:'#dcccff', lavD:'#8b6bd0', violet:'#7e5bc2',
    green:'#5fb34a', greenD:'#2f7a3a', greenL:'#8fd16a', mint:'#6fd3b8', mintL:'#b4f0dc', mintD:'#3fa88e',
    brown:'#9a5b3c', brownD:'#6a3b2a', brownL:'#c48a5a',
    skin:'#ffd8b8', skinD:'#f0aa88',
    sky:'#9ed8ff', skyL:'#cdeeff', blue:'#4a90d9', blueD:'#2f62a8', water:'#6cc4f0',
    gray:'#a7a9bc', grayD:'#6d6f86', grayL:'#d8d9e6',
    soil:'#8a5538', soilD:'#6a3d27', soilW:'#5a3020', soilWD:'#43231a',
    pot:'#d9734a', potD:'#a84f33', potL:'#f0a070',
    grass:'#7cc95a', grassD:'#5fae46', grassL:'#9fdc74',
    road:'#7d7a8c', roadD:'#6a6779', roadL:'#9693a6',
    hair1:'#5a3424', hair1D:'#3e2219', hair2:'#2c2232', hair2D:'#1a1420', hair3:'#c9774a', hair3D:'#9c5532'
  };

  // ---------------------------------------------------------------- Painter
  class Painter {
    constructor(w,h){ this.w=w; this.h=h; this.buf=new Array(w*h).fill(null); }
    px(x,y,c){ x=Math.round(x); y=Math.round(y); if(x>=0 && y>=0 && x<this.w && y<this.h) this.buf[y*this.w+x]=c; return this; }
    get(x,y){ if(x<0||y<0||x>=this.w||y>=this.h) return null; return this.buf[y*this.w+x]; }
    rect(x,y,w,h,c){ for(let j=0;j<h;j++) for(let i=0;i<w;i++) this.px(x+i,y+j,c); return this; }
    ell(cx,cy,rx,ry,c){
      for(let y=Math.floor(cy-ry-1); y<=Math.ceil(cy+ry+1); y++)
        for(let x=Math.floor(cx-rx-1); x<=Math.ceil(cx+rx+1); x++){
          const dx=(x+0.5-cx)/rx, dy=(y+0.5-cy)/ry;
          if(dx*dx+dy*dy<=1) this.px(x,y,c);
        }
      return this;
    }
    circ(cx,cy,r,c){ return this.ell(cx,cy,r,r,c); }
    line(x0,y0,x1,y1,c){
      x0=Math.round(x0); y0=Math.round(y0); x1=Math.round(x1); y1=Math.round(y1);
      const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1;
      let err=dx+dy;
      for(;;){ this.px(x0,y0,c); if(x0===x1 && y0===y1) break; const e2=2*err;
        if(e2>=dy){ err+=dy; x0+=sx; } if(e2<=dx){ err+=dx; y0+=sy; } }
      return this;
    }
    map(rows,pal,ox=0,oy=0){
      rows.forEach((row,y)=>[...row].forEach((ch,x)=>{ const c=pal[ch]; if(c) this.px(ox+x,oy+y,c); }));
      return this;
    }
    outline(c=C.out, diag=false){
      const add=[];
      for(let y=0; y<this.h; y++) for(let x=0; x<this.w; x++){
        if(this.get(x,y)) continue;
        const n = this.get(x-1,y) || this.get(x+1,y) || this.get(x,y-1) || this.get(x,y+1) ||
          (diag && (this.get(x-1,y-1)||this.get(x+1,y-1)||this.get(x-1,y+1)||this.get(x+1,y+1)));
        if(n) add.push([x,y]);
      }
      add.forEach(([x,y])=>this.px(x,y,c));
      return this;
    }
    canvas(){
      const cv=document.createElement('canvas'); cv.width=this.w; cv.height=this.h;
      const g=cv.getContext('2d'); const id=g.createImageData(this.w,this.h);
      for(let i=0;i<this.buf.length;i++){
        const c=this.buf[i]; if(!c) continue;
        const n=parseInt(c.slice(1),16);
        id.data[i*4]=n>>16;
        id.data[i*4+1]=(n>>8)&255;
        id.data[i*4+2]=n&255;
        id.data[i*4+3]=255;
      }
      g.putImageData(id,0,0);
      return cv;
    }
  }

  function sprite(w,h,fn,opt={}){
    const p=new Painter(w,h); fn(p);
    if(opt.outline !== false) p.outline(opt.outline || C.out, opt.diag || false);
    return p.canvas();
  }

  // ---------------------------------------------------------------- helpers
  function appendCanvas(parent, cv, w, h){
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    cv.style.imageRendering = 'pixelated';
    parent.appendChild(cv);
  }
  function imgFromCanvas(cv){
    const im=new Image(); im.src=cv.toDataURL(); return im;
  }
  function delay(ms){ return new Promise(res=>setTimeout(res,ms)); }

  // ---------------------------------------------------------------- sprites
  function makeStarSprite(lit){
    const rows = [
      '...yy...',
      '..yyyy..',
      '.yyyyyy.',
      'yyyyyyyy',
      'oyyyyyyo',
      '.oyyyyo.',
      '..oyyo..',
      '...oo...',
      '........',
      '........'
    ];
    const pal = { y: lit ? C.yellow : C.grayD, o: C.out };
    return sprite(10,10,p=>p.map(rows,pal), {outline:true});
  }

  function makeLockSprite(){
    return sprite(12,12,p=>{
      p.rect(3,4,6,6,C.yellow);
      p.rect(3,4,6,1,C.yellowD);
      p.rect(4,1,4,4,C.yellowD);
      p.rect(5,1,2,2,C.yellow);
      p.rect(5,6,2,2,C.orangeD);
      p.px(6,6,C.out);
    }, {outline:true});
  }

  function makeBossRobotSprite(){
    return sprite(20,18,p=>{
      p.rect(2,5,3,5,C.grayD);
      p.rect(15,5,3,5,C.grayD);
      p.rect(2,6,3,1,C.gray);
      p.rect(15,6,3,1,C.gray);
      p.ell(10,8,5,4.5,C.redD);
      p.ell(10,8,2.5,2.5,C.orange);
      p.rect(9,2,2,3,C.yellow);
      p.px(10,1,C.yellowD);
      p.rect(7,7,2,1,C.white);
      p.rect(12,7,2,1,C.white);
    }, {outline:true});
  }

  function makeFloorSprite(){
    return sprite(24,24,p=>{
      p.rect(0,0,24,24,'#2a3552');
      p.rect(0,0,24,1,C.out); p.rect(0,23,24,1,C.out);
      p.rect(0,0,1,24,C.out); p.rect(23,0,1,24,C.out);
      p.rect(0,4,24,1,'#25304a'); p.rect(0,8,24,1,'#25304a');
      p.rect(0,12,24,1,'#25304a'); p.rect(0,16,24,1,'#25304a');
      p.rect(0,20,24,1,'#25304a');
      p.rect(4,0,1,24,'#25304a'); p.rect(8,0,1,24,'#25304a');
      p.rect(12,0,1,24,'#25304a'); p.rect(16,0,1,24,'#25304a');
      p.rect(20,0,1,24,'#25304a');
      p.px(6,6,'#3b507a'); p.px(18,6,'#3b507a');
      p.px(2,14,'#3b507a'); p.px(22,18,'#3b507a');
    }, {outline:false});
  }

  function makeWallSprite(){
    return sprite(24,24,p=>{
      p.rect(0,0,24,24,'#5a5f78');
      p.rect(0,0,24,1,C.out); p.rect(0,23,24,1,C.out);
      p.rect(0,0,1,24,C.out); p.rect(23,0,1,24,C.out);
      for(let i=0;i<3;i++){
        const y=2+i*8;
        p.rect(0,y,24,1,'#3f4358');
        const off = i%2===0 ? 0 : 4;
        for(let x=-2;x<24;x+=8){
          p.rect(x+off, y-4, 6, 4, '#6d6f86');
          p.rect(x+off, y-4, 6, 1, C.grayL);
          p.rect(x+off, y, 6, 1, C.grayD);
        }
      }
    }, {outline:false});
  }

  function makeConveyorSprite(){
    return sprite(24,24,p=>{
      p.rect(0,0,24,24,'#3a4463');
      p.rect(0,0,24,1,C.out); p.rect(0,23,24,1,C.out);
      p.rect(0,0,1,24,C.out); p.rect(23,0,1,24,C.out);
      p.rect(0,7,24,4,'#272d48');
      p.rect(0,15,24,4,'#272d48');
      p.rect(0,10,24,1,'#4e5a80');
      p.rect(0,18,24,1,'#4e5a80');
      p.px(4,4,'#5c6890'); p.px(18,20,'#5c6890');
    }, {outline:false});
  }

  function makeArrowSprite(){
    return sprite(8,8,p=>{
      p.rect(0,3,5,1,C.yellow);
      p.rect(0,4,5,1,C.yellowD);
      p.rect(4,1,4,1,C.yellow);
      p.rect(5,2,3,1,C.yellow);
      p.rect(4,6,4,1,C.yellowD);
      p.rect(5,5,3,1,C.yellowD);
    }, {outline:true});
  }

  function makeFlagFrame(frame){
    return sprite(24,24,p=>{
      p.rect(2,2,1,20,C.grayD);
      p.rect(3,2,1,20,C.grayL);
      if(frame===0){
        p.rect(4,3,9,5,C.red);
        p.rect(13,3,1,5,C.redD);
        p.rect(12,3,1,5,C.redD);
        p.px(5,7,C.redD); p.px(11,5,C.pinkL);
      }else{
        p.rect(4,3,9,5,C.redD);
        p.rect(4,3,1,5,C.red);
        p.rect(13,3,2,5,C.red);
        p.px(6,7,C.redD); p.px(12,4,C.pinkL);
      }
    }, {outline:true});
  }

  function makeRobotSprite(){
    return sprite(20,18,p=>{
      p.rect(1,6,3,6,C.grayD);
      p.rect(16,6,3,6,C.grayD);
      p.rect(1,7,3,2,C.grayL);
      p.rect(16,7,3,2,C.grayL);
      p.ell(10,9,4.5,4.2,C.blue);
      p.ell(10,9,2.2,2.2,C.blueD);
      p.rect(9,3,2,3,C.yellow);
      p.px(10,2,C.yellowD);
      p.px(7,7,C.skyL);
      p.px(13,7,C.skyL);
      p.px(9,10,C.red);
      p.px(11,10,C.red);
    }, {outline:true});
  }

  function makeGlowSprite(){
    return sprite(10,12,p=>{
      p.rect(0,0,10,12,C.yellow);
      p.rect(1,1,8,10,C.yellowD);
      p.rect(2,2,6,8,C.yellow);
      p.rect(3,3,4,6,C.white);
    }, {outline:false});
  }

  function makePlayIcon(){
    return sprite(16,16,p=>{
      p.rect(5,3,2,10,C.green);
      p.rect(7,4,2,8,C.green);
      p.rect(9,5,2,6,C.greenL);
      p.rect(11,6,2,4,C.greenL);
      p.px(5,2,C.greenD); p.px(5,12,C.greenD);
    }, {outline:true});
  }

  function makeStepIcon(){
    return sprite(16,16,p=>{
      p.rect(5,3,3,10,C.yellow);
      p.rect(10,3,2,10,C.yellowD);
      p.px(5,2,C.yellowD); p.px(10,2,C.yellowD);
    }, {outline:true});
  }

  function makeResetIcon(){
    return sprite(16,16,p=>{
      p.ell(8,8,5.5,5.5,C.sky);
      p.ell(8,8,3.5,3.5,'#1e2638');
      p.rect(8,2,2,2,C.sky);
      p.rect(8,12,2,2,C.sky);
      p.rect(2,6,3,2,C.sky);
      p.rect(2,6,2,3,C.sky);
    }, {outline:true});
  }

  function makeLightIcon(){
    return sprite(16,16,p=>{
      p.ell(8,6,4,4,C.yellow);
      p.ell(8,4,2,2,C.white);
      p.rect(7,10,2,3,C.grayD);
      p.px(6,13,C.orange);
    }, {outline:true});
  }

  function makeHamburgerIcon(){
    return sprite(16,16,p=>{
      p.rect(3,3,10,2,C.white);
      p.rect(3,7,10,2,C.white);
      p.rect(3,11,10,2,C.white);
    }, {outline:true});
  }

  // ---------------------------------------------------------------- populate left
  const leftCellsData = [
    { label:'Làm quen', cells:[{n:1,stars:3},{n:2,stars:3},{n:3,stars:3}] },
    { label:'Luyện', cells:[{n:4,stars:3},{n:5,stars:2},{n:6,stars:2}] },
    { label:'Biến thể', cells:[{n:7,open:true},{n:8,locked:true},{n:9,locked:true}] },
  ];

  const challengeGrid = document.getElementById('challenge-grid');
  leftCellsData.forEach(rowData=>{
    const row=document.createElement('div'); row.className='challenge-row';
    const label=document.createElement('div'); label.className='row-label'; label.textContent=rowData.label;
    const cells=document.createElement('div'); cells.className='challenge-cells';
    rowData.cells.forEach(c=>{
      const cell=document.createElement('div'); cell.className='challenge-cell';
      if(c.stars) cell.classList.add('passed');
      else if(c.open) cell.classList.add('open');
      else cell.classList.add('locked');
      const num=document.createElement('span'); num.className='cell-num'; num.textContent=c.n;
      cell.appendChild(num);
      if(c.stars){
        const stars=document.createElement('div'); stars.className='cell-stars';
        for(let i=0;i<c.stars;i++) appendCanvas(stars, makeStarSprite(true), 12, 12);
        cell.appendChild(stars);
      }else if(c.locked){
        const lock=document.createElement('div'); lock.className='cell-lock';
        appendCanvas(lock, makeLockSprite(), 20, 20);
        cell.appendChild(lock);
      }
      if(c.n<=7){
        cell.addEventListener('click', ()=>{
          cell.classList.add('pressed');
          setTimeout(()=>cell.classList.remove('pressed'), 150);
        });
      }
      cells.appendChild(cell);
    });
    row.appendChild(label); row.appendChild(cells);
    challengeGrid.appendChild(row);
  });

  appendCanvas(document.getElementById('boss-sprite'), makeBossRobotSprite(), 40, 36);
  appendCanvas(document.getElementById('boss-lock'), makeLockSprite(), 18, 18);

  const library = document.getElementById('library');
  const libLabel = document.createElement('span'); libLabel.className='library-label'; libLabel.textContent='Thư viện:';
  library.appendChild(libLabel);
  ['move','turn_right'].forEach(txt=>{
    const pill=document.createElement('span'); pill.className='pill'; pill.textContent=txt;
    library.appendChild(pill);
  });

  // ---------------------------------------------------------------- populate right top
  const gameStars=document.getElementById('game-stars');
  for(let i=0;i<3;i++) appendCanvas(gameStars, makeStarSprite(i<2), 16, 16);
  appendCanvas(document.getElementById('menu-btn'), makeHamburgerIcon(), 18, 18);

  appendCanvas(document.getElementById('btn-run'), makePlayIcon(), 24, 24);
  appendCanvas(document.getElementById('btn-step'), makeStepIcon(), 24, 24);
  appendCanvas(document.getElementById('btn-reset'), makeResetIcon(), 24, 24);
  appendCanvas(document.getElementById('btn-light'), makeLightIcon(), 24, 24);

  // ---------------------------------------------------------------- code slots
  function createSlots(parent, items){
    const arr=[];
    items.forEach(item=>{
      const div=document.createElement('div'); div.className='slot';
      if(item.locked){
        div.classList.add('locked');
        appendCanvas(div, makeLockSprite(), 12, 12);
      }else if(item.empty){
        div.classList.add('empty'); div.textContent='·';
      }else{
        div.textContent=item.text;
      }
      parent.appendChild(div); arr.push(div);
    });
    return arr;
  }

  const mainItems=[
    {text:'move()'}, {text:'move()'}, {text:'turn_right()'}, {text:'move()'}, {text:'move()'},
    {empty:true}, {empty:true}, {locked:true}
  ];
  const fnItems=[
    {text:'def move():'}, {text:'  left_move()'}, {text:'  right_move()'}, {text:'  wait()'},
    {text:'def turn_right():'}, {text:'  left_move()'}, {text:'  wait()'}, {empty:true}
  ];
  const mainSlots=createSlots(document.getElementById('main-slots'), mainItems);
  const fnSlots=createSlots(document.getElementById('fn-slots'), fnItems);

  // ---------------------------------------------------------------- tray
  const tray=document.getElementById('tray');
  [['left_move','right_move','wait'],['def','for','move','⌫']].forEach(rowItems=>{
    const row=document.createElement('div'); row.className='tray-row';
    rowItems.forEach(txt=>{
      const btn=document.createElement('button'); btn.className='pill'; btn.textContent=txt;
      row.appendChild(btn);
    });
    tray.appendChild(row);
  });

  // ---------------------------------------------------------------- field
  const MAP=[
    [0, 1, 0, 0, 2],
    [0, 0, 0, 0, 1],
    [0, 0, 'flag', 0, 0],
    [0, 1, 2, 0, 0],
    [0, 0, 0, 1, 0],
  ];
  const flagCell={r:2,c:2};
  const floorSprite=makeFloorSprite();
  const wallSprite=makeWallSprite();
  const conveyorSprite=makeConveyorSprite();
  const arrowSprite=makeArrowSprite();
  const flagFrames=[makeFlagFrame(0), makeFlagFrame(1)];

  const baseCanvas=document.createElement('canvas');
  baseCanvas.width=120; baseCanvas.height=120;
  const bctx=baseCanvas.getContext('2d'); bctx.imageSmoothingEnabled=false;
  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){
      bctx.drawImage(floorSprite, c*24, r*24);
      if(MAP[r][c]===1) bctx.drawImage(wallSprite, c*24, r*24);
      if(MAP[r][c]===2) bctx.drawImage(conveyorSprite, c*24, r*24);
    }
  }

  const fieldCanvas=document.getElementById('field-canvas');
  const fctx=fieldCanvas.getContext('2d');
  fctx.imageSmoothingEnabled=false;
  const conveyorCells=[];
  for(let r=0;r<5;r++) for(let c=0;c<5;c++) if(MAP[r][c]===2) conveyorCells.push([r,c]);

  function drawConveyorArrows(t){
    const off=Math.floor(t/150)%24;
    conveyorCells.forEach(([r,c])=>{
      for(let x=-24;x<24;x+=12){
        const ax=((x+off)%24+24)%24;
        fctx.drawImage(arrowSprite, c*24+ax, r*24+9);
      }
    });
  }
  function drawFlag(t){
    const frame=flagFrames[Math.floor(t/300)%2];
    fctx.drawImage(frame, flagCell.c*24, flagCell.r*24);
  }
  function frame(t){
    fctx.clearRect(0,0,120,120);
    fctx.drawImage(baseCanvas,0,0);
    drawConveyorArrows(t||0);
    drawFlag(t||0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------------------------------------------------------------- robot setup
  const robotWrap=document.getElementById('robot-wrap');
  const robotImg=document.getElementById('robot-sprite');
  const glowLeft=document.getElementById('glow-left');
  const glowRight=document.getElementById('glow-right');
  robotImg.src=makeRobotSprite().toDataURL();
  const glowSrc=makeGlowSprite().toDataURL();
  glowLeft.src=glowSrc; glowRight.src=glowSrc;

  const sim={ row:4, col:0, angle:0, leftPend:false, rightPend:false };

  function setRobotTransition(on){
    robotWrap.style.transition = on ? 'left .45s cubic-bezier(.2,.8,.2,1), top .45s cubic-bezier(.2,.8,.2,1)' : 'none';
    robotImg.style.transition = on ? 'transform .35s cubic-bezier(.2,.8,.2,1)' : 'none';
  }
  function setActiveSlots(mainIdx, fnIdx){
    mainSlots.forEach((el,i)=>el.classList.toggle('active', i===mainIdx));
    fnSlots.forEach((el,i)=>el.classList.toggle('active', i===fnIdx));
  }
  function setWheelActive(side, on){
    robotWrap.classList.toggle('active-left', side==='left' && on);
    robotWrap.classList.toggle('active-right', side==='right' && on);
    if(!on) robotWrap.classList.remove('active-left','active-right');
  }
  function resetSim(){
    runId++;
    running=false;
    sim.row=4; sim.col=0; sim.angle=0; sim.leftPend=false; sim.rightPend=false;
    setRobotTransition(false);
    robotWrap.style.left = sim.col*48 + 'px';
    robotWrap.style.top = sim.row*48 + 2 + 'px';
    robotImg.style.transform = 'rotate(0deg)';
    setActiveSlots(null,null);
    setWheelActive(null,false);
    void robotWrap.offsetWidth;
    setRobotTransition(true);
  }

  // ---------------------------------------------------------------- simulation
  const mainProgram=['move','move','turn_right','move','move'];
  const macros={
    move:{ defLine:0, body:[{fn:1,kind:'wheel-left'},{fn:2,kind:'wheel-right'},{fn:3,kind:'wait'}] },
    turn_right:{ defLine:4, body:[{fn:5,kind:'wheel-left'},{fn:6,kind:'wait'}] },
  };
  let runId=0;
  let running=false;

  function buildQueue(){
    const q=[];
    mainProgram.forEach((type, mainIdx)=>{
      const macro=macros[type];
      q.push({main:mainIdx, fn:macro.defLine, kind:'call'});
      macro.body.forEach(b=>q.push({main:mainIdx, fn:b.fn, kind:b.kind}));
    });
    return q;
  }

  async function doBeat(){
    const left=sim.leftPend, right=sim.rightPend;
    sim.leftPend=sim.rightPend=false;
    if(left && right){
      const rad=sim.angle*Math.PI/180;
      const dc=Math.round(Math.sin(rad));
      const dr=-Math.round(Math.cos(rad));
      const nr=sim.row+dr, nc=sim.col+dc;
      if(nr>=0 && nr<5 && nc>=0 && nc<5){
        robotWrap.style.left=nc*48+'px';
        robotWrap.style.top=nr*48+2+'px';
        await delay(450);
        sim.row=nr; sim.col=nc;
      }
    }else if(left && !right){
      sim.angle=(sim.angle+90)%360;
      robotImg.style.transform='rotate('+sim.angle+'deg)';
      await delay(400);
    }else if(right && !left){
      sim.angle=(sim.angle-90+360)%360;
      robotImg.style.transform='rotate('+sim.angle+'deg)';
      await delay(400);
    }else{
      await delay(200);
    }
    setWheelActive(null,false);
  }

  async function executeStep(step){
    setActiveSlots(step.main, step.fn);
    if(step.kind==='call'){
      await delay(220);
    }else if(step.kind==='wheel-left'){
      sim.leftPend=true; setWheelActive('left',true); await delay(260);
    }else if(step.kind==='wheel-right'){
      sim.rightPend=true; setWheelActive('right',true); await delay(260);
    }else if(step.kind==='wait'){
      await doBeat();
    }
  }

  async function startRun(){
    if(running) return;
    resetSim();
    running=true;
    const id=++runId;
    const queue=buildQueue();
    for(const step of queue){
      if(id!==runId) return;
      await executeStep(step);
    }
    if(id===runId){
      running=false;
      setActiveSlots(null,null);
      setWheelActive(null,false);
    }
  }

  document.getElementById('btn-run').addEventListener('click', startRun);
  document.getElementById('btn-reset').addEventListener('click', resetSim);
  document.getElementById('btn-step').addEventListener('click', ()=>{
    if(running) return;
    if(sim.row!==4 || sim.col!==0 || sim.angle!==0) resetSim();
    running=true;
    const id=++runId;
    const queue=buildQueue();
    executeStep(queue[0]).finally(()=>{
      if(id===runId){
        running=false;
        setActiveSlots(null,null);
        setWheelActive(null,false);
      }
    });
  });
  document.getElementById('btn-light').addEventListener('click', ()=>{
    document.getElementById('btn-light').classList.add('pressed');
    setTimeout(()=>document.getElementById('btn-light').classList.remove('pressed'), 150);
  });

  document.getElementById('prev-chapter').addEventListener('click', ()=>{
    document.getElementById('prev-chapter').classList.add('pressed');
    setTimeout(()=>document.getElementById('prev-chapter').classList.remove('pressed'), 150);
  });
  document.getElementById('next-chapter').addEventListener('click', ()=>{
    document.getElementById('next-chapter').classList.add('pressed');
    setTimeout(()=>document.getElementById('next-chapter').classList.remove('pressed'), 150);
  });

  resetSim();
})();
</script>
</body>
</html>
