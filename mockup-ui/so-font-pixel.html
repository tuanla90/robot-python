<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>So font pixel</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@kfonts/neodgm@0.5.0/index.css">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Handjet:wght@400;700&family=Pixelify+Sans:wght@400;700&family=Baloo+2:wght@600;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#2a1a10;color:#f6ecd2;font-family:sans-serif;padding:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.o{background:#1f4d3a;border:4px solid #8a5a2b;padding:10px 12px}
.ten{font:700 13px sans-serif;color:#ffd84d;margin-bottom:6px;letter-spacing:.5px}
.tieu{font-size:var(--to);color:#ffd84d;margin:2px 0 6px}
.nut{display:inline-block;background:#3fb950;color:#fff;padding:2px 8px;margin:2px 4px 2px 0;font-size:var(--vua);border:2px solid #10301f}
.nut.v{background:#f2b81f;color:#2a1a10}.nut.x{background:#3b82d6}.nut.t{background:#8b5cf6}
.cau{font-size:var(--nho);line-height:1.35;margin:6px 0}
.code{background:#f3e7c6;color:#1d3b2c;padding:4px 8px;font-size:var(--code);line-height:1.4;white-space:pre}
.code b{color:#7c3aed;font-weight:inherit}
</style></head><body>
<div class="grid">
<script>
const MAU=[
 ['A · Galmuri11 + GalmuriMono11','Galmuri11','GalmuriMono11','24px','18px','12px','12px','Galmuri11'],
 ['B · Galmuri11 Bold (tiêu đề) + Galmuri11','Galmuri11','GalmuriMono11','24px','18px','12px','12px','Galmuri11-Bold'],
 ['C · VT323 (cả chữ lẫn code)','VT323','VT323','32px','22px','20px','20px','VT323'],
 ['D · Handjet + VT323','Handjet','VT323','30px','22px','18px','20px','Handjet'],
 ['E · NeoDunggeunmo','NeoDunggeunmo','NeoDunggeunmo','24px','18px','16px','16px','NeoDunggeunmo'],
 ['F · Pixelify Sans (bản cũ, để so)','Pixelify Sans','VT323','24px','18px','14px','18px','Pixelify Sans'],
 ['G · Baloo 2 + JetBrains Mono (hiện tại, không pixel)','Baloo 2','JetBrains Mono','24px','18px','14px','13px','Baloo 2'],
];
for(const [ten,chu,code,to,vua,nho,cs,tieuFont] of MAU){
 document.write(`<div class="o" style="--to:${to};--vua:${vua};--nho:${nho};--code:${cs};font-family:'${chu}',monospace">
 <div class="ten">${ten}</div>
 <div class="tieu" style="font-family:'${tieuFont}','${chu}';${tieuFont==='Handjet'?'font-weight:700':''}">Chuỗi 2 · Xưởng hàm</div>
 <span class="nut">▶ Chạy</span><span class="nut v">Nhịp</span><span class="nut x">Lại</span><span class="nut t">Gợi ý</span>
 <div class="cau">Hàm của em · lưu, dùng mãi qua mọi màn. Chương trình kết thúc khi còn lệnh bánh chưa có wait() theo sau. Ước được ở đường dài: ạ ị ợ ữ ỳ ẵ ẫ Đ ầ ổ ự. NHỊP 12 · 9/10 ô</div>
 <div class="code" style="font-family:'${code}',monospace"><b>def</b> turn_right():
    left_move()
    wait()
move()  # tiến một ô</div></div>`);
}
</script>
</div></body></html>
