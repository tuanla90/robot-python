<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Pixel UI Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Baloo+2&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;display:flex;justify-content:center;align-items:center;background:#111;}
  .container{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .phone{width:360px;height:640px;background:#fff;image-rendering:pixelated;overflow:hidden;position:relative;font-family:'VT323',monospace;box-shadow:0 0 0 2px #333;}
  .screen{width:100%;height:100%;position:absolute;top:0;left:0;}
  .left{background:#e0f7fa;}
  .right{background:#fce4ec;}
  .title{font-size:24px;text-align:center;padding:8px;background:#333;color:#fff;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:4px;padding:8px;}
  .grid button{font-size:20px;height:60px;background:#fff;border:2px solid #000;cursor:pointer;}
  .toolbar{position:absolute;bottom:0;width:100%;height:50px;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .code-area{font-size:14px;line-height:1.2;white-space:pre;background:#222;color:#0f0;padding:8px;overflow:auto;height:230px;}
  .bottom-bar{position:absolute;bottom:0;width:100%;height:100px;background:#ddd;display:flex;flex-wrap:wrap;gap:4px;padding:4px;}
  .bottom-bar button{flex:1 1 30%;height:30px;background:#fff;border:1px solid #000;cursor:pointer;}
  .pixelated{image-rendering:pixelated;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="container">
  <!-- Left Phone – UI Screen -->
  <div class="phone left" id="leftPhone">
    <div class="screen">
      <div class="title">Chuỗi 2 · Xưởng hàm</div>
      <div style="display:flex;justify-content:space-between;padding:0 8px;">
        <button id="prevBtn" style="font-size:20px;">‹</button>
        <span id="progress" style="font-size:18px;">6/10</span>
        <button id="nextBtn" style="font-size:20px;">›</button>
      </div>
      <div class="grid" id="grid">
        <!-- 3x3 grid -->
        <button data-id="1" class="locked hidden"></button>
        <button data-id="2" class="locked hidden"></button>
        <button data-id="3" class="locked hidden"></button>
        <button data-id="4" class="locked hidden"></button>
        <button data-id="5" class="locked hidden"></button>
        <button data-id="6" class="locked hidden"></button>
        <button data-id="7" class="active">7</button>
        <button data-id="8" class="locked" disabled>🔒</button>
        <button data-id="9" class="locked" disabled>🔒</button>
      </div>
      <div class="toolbar" id="runBtn">▶ RUN</div>
      <div class="bottom-bar">
        <span>Thư viện:</span>
        <button>move</button>
        <button>turn_right</button>
        <button>...</button>
      </div>
    </div>
  </div>

  <!-- Right Phone – Code / Playground -->
  <div class="phone right" id="rightPhone">
    <div class="screen">
      <div class="title">2.4 · turn_right()</div>
      <div class="code-area" id="codeLeft">
        CHÍNH 5/8\nmove()\nmove()\nturn_right()\nmove()\nmove()\n\n\n[ ]
      </div>
      <div class="code-area" id="codeRight" style="margin-top:4px;">
        HÀM 7/8\ndef move():\n  left_move()\n  right_move()\n  wait()\ndef turn_right():\n  left_move()\n  wait()\n[ ]
      </div>
    </div>
  </div>
</div>
<script>
  // Minimal simulation: highlight running line on both sides when Run is clicked
  const runBtn = document.getElementById('runBtn');
  const leftCode = document.getElementById('codeLeft');
  const rightCode = document.getElementById('codeRight');

  function highlightLine(area, lineIdx) {
    const lines = area.textContent.split('\n');
    const highlighted = lines.map((ln,i)=> i===lineIdx? '['+ln+']' : ln);
    area.textContent = highlighted.join('\n');
  }

  runBtn.addEventListener('click',()=>{
    let idx=0;
    const total = Math.max(leftCode.textContent.split('\n').length, rightCode.textContent.split('\n').length);
    const interval = setInterval(()=>{
      if(idx>0){highlightLine(leftCode, idx-1);highlightLine(rightCode, idx-1);} // remove previous
      if(idx<total){highlightLine(leftCode, idx);highlightLine(rightCode, idx);} else {clearInterval(interval);}
      idx++;
    },500);
  });
</script>
</body>
</html>
